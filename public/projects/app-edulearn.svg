<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320">
  <defs>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131B2E"/>
      <stop offset="100%" stop-color="#0B101C"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1D273D"/>
      <stop offset="100%" stop-color="#151C2C"/>
    </linearGradient>
    <linearGradient id="highlightGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#283654"/>
      <stop offset="100%" stop-color="#1B2438"/>
    </linearGradient>
  </defs>
  
  <rect width="600" height="320" fill="url(#bgGrad)"/>
  <circle cx="450" cy="100" r="160" fill="#38BDF8" opacity="0.12" filter="url(#neon)"/>

  <g transform="translate(24, 18)">
    <rect width="552" height="282" rx="10" fill="url(#cardGrad)" stroke="#38496B" stroke-width="1.5"/>

    <!-- Course Banner -->
    <rect x="18" y="16" width="516" height="58" rx="6" fill="#131B2E" stroke="#38496B"/>
    <text x="32" y="38" font-family="'Inter', sans-serif" font-size="16.5" font-weight="800" fill="#FFFFFF">Advanced Data Structures &amp; Algorithms</text>
    <text x="32" y="58" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#38BDF8">Module 4: Graph Traversal &amp; Dynamic Programming</text>
    
    <rect x="395" y="22" width="125" height="34" rx="6" fill="#10B981" stroke="#34D399"/>
    <text x="408" y="44" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="bold" fill="#022C1A">82% COMPLETE</text>

    <!-- Modules List (Left) -->
    <g transform="translate(18, 88)">
      <rect width="270" height="46" rx="6" fill="#0D2E1C" stroke="#10B981" stroke-width="1.5"/>
      <circle cx="24" cy="23" r="10" fill="#10B981"/>
      <text x="20" y="28" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#000000">✓</text>
      <text x="42" y="28" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">1. Binary Trees &amp; BST Search</text>

      <g transform="translate(0, 52)">
        <rect width="270" height="46" rx="6" fill="#0D2E1C" stroke="#10B981" stroke-width="1.5"/>
        <circle cx="24" cy="23" r="10" fill="#10B981"/>
        <text x="20" y="28" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#000000">✓</text>
        <text x="42" y="28" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">2. Heap Sort &amp; Priority Queues</text>
      </g>

      <g transform="translate(0, 104)">
        <rect width="270" height="46" rx="6" fill="#0C2542" stroke="#38BDF8" stroke-width="2"/>
        <circle cx="24" cy="23" r="10" fill="#38BDF8"/>
        <text x="42" y="28" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#38BDF8">3. Dijkstra's Shortest Path</text>
      </g>
    </g>

    <!-- Interactive Challenge Card (Right) -->
    <g transform="translate(304, 88)">
      <rect width="230" height="178" rx="6" fill="#131B2E" stroke="#38496B"/>
      <text x="16" y="26" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="bold" fill="#F59E0B">QUIZ: GRAPH COMPLEXITY</text>
      <text x="16" y="48" font-family="'Inter', sans-serif" font-size="12" fill="#E2E8F0">What is time complexity of</text>
      <text x="16" y="66" font-family="'Inter', sans-serif" font-size="12" fill="#E2E8F0">Dijkstra with Min-Heap?</text>
      
      <rect x="16" y="84" width="198" height="34" rx="4" fill="#10B981" stroke="#34D399"/>
      <text x="28" y="106" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="bold" fill="#022C1A">A) O((V + E) log V) ✓</text>

      <rect x="16" y="126" width="198" height="34" rx="4" fill="#1E2A42" stroke="#38496B"/>
      <text x="28" y="148" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">B) O(V^2)</text>
    </g>
  </g>

</svg>