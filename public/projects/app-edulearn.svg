<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <linearGradient id="bgEdu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E1624"/>
      <stop offset="100%" stop-color="#080D17"/>
    </linearGradient>
    <linearGradient id="panelEdu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141E30"/>
      <stop offset="100%" stop-color="#0E1624"/>
    </linearGradient>
  </defs>

  <rect width="600" height="340" fill="url(#bgEdu)"/>

  <!-- Top App Window Bar -->
  <g transform="translate(0, 0)">
    <rect width="600" height="36" fill="#0A0E18" stroke="#1E293B" stroke-width="1"/>
    <circle cx="20" cy="18" r="4.5" fill="#EF4444"/>
    <circle cx="36" cy="18" r="4.5" fill="#F59E0B"/>
    <circle cx="52" cy="18" r="4.5" fill="#10B981"/>

    <rect x="140" y="8" width="320" height="20" rx="10" fill="#131B2B" stroke="#223048" stroke-width="1"/>
    <text x="300" y="22" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#94A3B8" text-anchor="middle">edulearn.academy/algorithms-curriculum</text>

    <rect x="475" y="8" width="110" height="20" rx="10" fill="#064E3B" stroke="#059669" stroke-width="1"/>
    <circle cx="487" cy="18" r="3" fill="#34D399"/>
    <text x="537" y="22" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#34D399" text-anchor="middle">88% PROGRESS</text>
  </g>

  <!-- Main Split Dashboard -->
  <!-- Left Side: Interactive Curriculum Pathway (275 width) -->
  <g transform="translate(18, 48)">
    <rect width="272" height="276" rx="12" fill="url(#panelEdu)" stroke="#223552" stroke-width="1"/>

    <g transform="translate(16, 16)">
      <text x="0" y="0" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">Algorithms Learning Pathway</text>
      <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10B981">Interactive CS Curriculum</text>
    </g>

    <!-- Module Roadmap Cards -->
    <g transform="translate(16, 44)">
      <!-- Module 1 -->
      <g transform="translate(0, 0)">
        <rect width="240" height="46" rx="8" fill="#0B1322" stroke="#10B981" stroke-width="1"/>
        <g transform="translate(10, 16)">
          <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#34D399">✓ MOD 1: POINTERS &amp; ARRAYS</text>
          <text x="0" y="16" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8">Memory Allocation &amp; Complexity</text>
          <text x="180" y="8" font-family="'JetBrains Mono', monospace" font-size="8" fill="#34D399">100%</text>
        </g>
      </g>

      <!-- Module 2 -->
      <g transform="translate(0, 54)">
        <rect width="240" height="46" rx="8" fill="#0B1322" stroke="#10B981" stroke-width="1"/>
        <g transform="translate(10, 16)">
          <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#34D399">✓ MOD 2: TREES &amp; BALANCING</text>
          <text x="0" y="16" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8">AVL Trees &amp; Min/Max Heaps</text>
          <text x="180" y="8" font-family="'JetBrains Mono', monospace" font-size="8" fill="#34D399">100%</text>
        </g>
      </g>

      <!-- Module 3 (Active) -->
      <g transform="translate(0, 108)">
        <rect width="240" height="46" rx="8" fill="#0F243A" stroke="#0284C7" stroke-width="1.2"/>
        <g transform="translate(10, 16)">
          <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#38BDF8">▶ MOD 3: DYNAMIC PROGRAMMING</text>
          <text x="0" y="16" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8">Memoization &amp; Tabulation</text>
          <text x="180" y="8" font-family="'JetBrains Mono', monospace" font-size="8" fill="#38BDF8">88%</text>
        </g>
      </g>

      <!-- Module 4 -->
      <g transform="translate(0, 162)">
        <rect width="240" height="46" rx="8" fill="#0B1322" stroke="#1E293B"/>
        <g transform="translate(10, 16)">
          <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#64748B">○ MOD 4: GRAPH ALGORITHMS</text>
          <text x="0" y="16" font-family="'Inter', sans-serif" font-size="9" fill="#475569">Dijkstra &amp; Topological Sort</text>
          <text x="175" y="8" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748B">LOCKED</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Right Side: Interactive Code Sandbox & Verification (285 width) -->
  <g transform="translate(303, 48)">
    <rect width="279" height="276" rx="12" fill="url(#panelEdu)" stroke="#223552" stroke-width="1"/>

    <g transform="translate(16, 16)">
      <text x="0" y="0" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">Interactive Code Sandbox</text>
      <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38BDF8">Python Algorithmic Evaluator</text>
    </g>

    <!-- Code Editor Pane -->
    <g transform="translate(16, 44)">
      <rect width="247" height="154" rx="8" fill="#0B1322" stroke="#1D2A42"/>
      
      <!-- Editor Tab -->
      <rect x="0" y="0" width="247" height="22" rx="8" fill="#141E30"/>
      <text x="10" y="15" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38BDF8">knapsack_dp.py</text>

      <!-- Code Lines -->
      <g transform="translate(10, 38)" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8">
        <text x="0" y="0"><tspan fill="#F59E0B">def</tspan> <tspan fill="#38BDF8">knapsack</tspan>(W, wt, val, n):</text>
        <text x="10" y="16">dp = [[0]*(W+1) <tspan fill="#F59E0B">for</tspan> _ <tspan fill="#F59E0B">in</tspan> range(n+1)]</text>
        <text x="10" y="32"><tspan fill="#F59E0B">for</tspan> i <tspan fill="#F59E0B">in</tspan> range(1, n+1):</text>
        <text x="20" y="48"><tspan fill="#F59E0B">for</tspan> w <tspan fill="#F59E0B">in</tspan> range(1, W+1):</text>
        <text x="30" y="64"><tspan fill="#F59E0B">if</tspan> wt[i-1] &lt;= w:</text>
        <text x="40" y="80">dp[i][w] = max(val[i-1], ...)</text>
        <text x="10" y="98"><tspan fill="#F59E0B">return</tspan> dp[n][W]</text>
      </g>
    </g>

    <!-- Test Evaluation Output Box -->
    <g transform="translate(16, 208)">
      <rect width="247" height="48" rx="8" fill="#064E3B" stroke="#059669"/>
      <g transform="translate(12, 18)">
        <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="bold" fill="#34D399">✓ 12/12 TEST CASES PASSED</text>
        <text x="0" y="16" font-family="'JetBrains Mono', monospace" font-size="9" fill="#A7F3D0">Execution Time: 0.42ms · Space: O(N*W)</text>
      </g>
    </g>
  </g>
</svg>