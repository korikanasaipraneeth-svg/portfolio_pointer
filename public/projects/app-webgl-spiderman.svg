<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <radialGradient id="meshGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E05269" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#E05269" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="windowBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E131F"/>
      <stop offset="100%" stop-color="#070A10"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#151D2E"/>
      <stop offset="100%" stop-color="#0F1422"/>
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Canvas Background -->
  <rect width="600" height="340" fill="url(#windowBg)"/>

  <!-- Top App Window Bar -->
  <g transform="translate(0, 0)">
    <rect width="600" height="36" fill="#0A0E18" stroke="#1E293B" stroke-width="1"/>
    <!-- macOS Traffic Light Dots -->
    <circle cx="20" cy="18" r="4.5" fill="#EF4444"/>
    <circle cx="36" cy="18" r="4.5" fill="#F59E0B"/>
    <circle cx="52" cy="18" r="4.5" fill="#10B981"/>

    <!-- URL Pill -->
    <rect x="140" y="8" width="320" height="20" rx="10" fill="#141C2B" stroke="#25354F" stroke-width="1"/>
    <text x="300" y="22" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#94A3B8" text-anchor="middle">spyderman-portfolio.vercel.app</text>

    <!-- Status Badge -->
    <rect x="495" y="8" width="85" height="20" rx="10" fill="#064E3B" stroke="#059669" stroke-width="1"/>
    <circle cx="506" cy="18" r="3" fill="#34D399"/>
    <text x="546" y="22" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#34D399" text-anchor="middle">60 FPS</text>
  </g>

  <!-- Ambient Radial Glow in 3D Viewport -->
  <circle cx="290" cy="170" r="140" fill="url(#meshGlow)"/>

  <!-- Left Telemetry Panel -->
  <g transform="translate(20, 52)">
    <rect width="135" height="225" rx="10" fill="url(#cardBg)" stroke="#22304A" stroke-width="1"/>
    <text x="14" y="24" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="bold" fill="#E05269">GPU TELEMETRY</text>
    
    <g transform="translate(14, 40)">
      <text x="0" y="0" font-family="'Inter', sans-serif" font-size="9" fill="#64748B">Context</text>
      <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="bold" fill="#F1F5F9">WebGL 2.0</text>

      <text x="0" y="38" font-family="'Inter', sans-serif" font-size="9" fill="#64748B">Draw Calls</text>
      <text x="0" y="52" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="bold" fill="#38BDF8">14 / frame</text>

      <text x="0" y="76" font-family="'Inter', sans-serif" font-size="9" fill="#64748B">Vertex Shaders</text>
      <text x="0" y="90" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="bold" fill="#F1F5F9">GLSL Custom</text>

      <text x="0" y="114" font-family="'Inter', sans-serif" font-size="9" fill="#64748B">Physics Loop</text>
      <text x="0" y="128" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="bold" fill="#34D399">Spring 60Hz</text>

      <text x="0" y="152" font-family="'Inter', sans-serif" font-size="9" fill="#64748B">Memory</text>
      <text x="0" y="166" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="bold" fill="#A855F7">38.4 MB</text>
    </g>
  </g>

  <!-- Center: 3D Polyhedral Constellation & Camera Grid -->
  <g transform="translate(290, 165)">
    <!-- Perspective Horizon Ellipses -->
    <ellipse cx="0" cy="0" rx="105" ry="38" fill="none" stroke="#25354F" stroke-width="1" stroke-dasharray="3 3"/>
    <ellipse cx="0" cy="0" rx="80" ry="80" fill="none" stroke="#E05269" stroke-opacity="0.3" stroke-width="1.2"/>
    <ellipse cx="0" cy="0" rx="55" ry="55" fill="none" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="1"/>

    <!-- 3D Polyhedron Wireframe Edges -->
    <path d="M0 -65 L55 -20 L35 48 L-35 48 L-55 -20 Z" fill="none" stroke="#E05269" stroke-width="1.8"/>
    <path d="M0 65 L-55 20 L-35 -48 L35 -48 L55 20 Z" fill="none" stroke="#38BDF8" stroke-width="1.2"/>
    <line x1="0" y1="-65" x2="0" y2="65" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1"/>
    <line x1="-55" y1="-20" x2="55" y2="20" stroke="#E05269" stroke-opacity="0.5" stroke-width="1"/>
    <line x1="55" y1="-20" x2="-55" y2="20" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1"/>

    <!-- Core Radiant Energy Nodes -->
    <circle cx="0" cy="0" r="12" fill="#E05269" fill-opacity="0.8"/>
    <circle cx="0" cy="0" r="6" fill="#FFFFFF"/>
    
    <!-- Outer Floating Energy Vertices -->
    <circle cx="0" cy="-65" r="4.5" fill="#38BDF8"/>
    <circle cx="55" cy="-20" r="4" fill="#E05269"/>
    <circle cx="35" cy="48" r="4" fill="#34D399"/>
    <circle cx="-35" cy="48" r="4" fill="#E05269"/>
    <circle cx="-55" cy="-20" r="4" fill="#38BDF8"/>
    <circle cx="0" cy="65" r="4.5" fill="#F59E0B"/>
  </g>

  <!-- Right Shader Code Inspector Pane -->
  <g transform="translate(425, 52)">
    <rect width="155" height="225" rx="10" fill="url(#cardBg)" stroke="#22304A" stroke-width="1"/>
    <rect width="155" height="26" rx="10" fill="#141C2B"/>
    <text x="12" y="17" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="bold" fill="#38BDF8">vertexShader.glsl</text>

    <g transform="translate(12, 42)" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8">
      <text x="0" y="0"><tspan fill="#E05269">uniform</tspan> float uTime;</text>
      <text x="0" y="16"><tspan fill="#E05269">uniform</tspan> vec2 uMouse;</text>
      <text x="0" y="32"><tspan fill="#38BDF8">varying</tspan> vec2 vUv;</text>
      <text x="0" y="48"><tspan fill="#38BDF8">varying</tspan> vec3 vNorm;</text>
      <text x="0" y="68"><tspan fill="#F59E0B">void</tspan> main() {</text>
      <text x="10" y="84">vUv = uv;</text>
      <text x="10" y="100">vec3 pos = position;</text>
      <text x="10" y="116">pos.z += sin(pos.x</text>
      <text x="16" y="132">* 4.0 + uTime) * 0.1;</text>
      <text x="10" y="148">gl_Position = proj *</text>
      <text x="16" y="164">view * model * pos;</text>
      <text x="0" y="180">}</text>
    </g>
  </g>

  <!-- Bottom Timeline Scrubber -->
  <g transform="translate(20, 288)">
    <rect width="560" height="38" rx="8" fill="#0D131F" stroke="#1E293B" stroke-width="1"/>
    <!-- Progress Bar -->
    <rect x="18" y="17" width="524" height="4" rx="2" fill="#1E293B"/>
    <rect x="18" y="17" width="310" height="4" rx="2" fill="#E05269"/>

    <!-- Keyframe Markers -->
    <circle cx="18" cy="19" r="5" fill="#E05269" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="18" y="32" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748B">01:INTRO</text>

    <circle cx="170" cy="19" r="5" fill="#E05269" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="170" y="32" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748B">02:3D HERO</text>

    <circle cx="328" cy="19" r="6" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2"/>
    <text x="328" y="32" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" fill="#38BDF8">03:JOURNEY</text>

    <circle cx="542" cy="19" r="5" fill="#1E293B" stroke="#64748B" stroke-width="1"/>
    <text x="515" y="32" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748B">04:DISPATCH</text>
  </g>
</svg>