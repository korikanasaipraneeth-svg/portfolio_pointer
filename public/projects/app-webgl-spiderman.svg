<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="cardGrad7" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121622"/>
      <stop offset="100%" stop-color="#0A0C13"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="#080A0F"/>
  
    <rect x="0" y="0" width="600" height="34" fill="#0E111A" />
    <line x1="0" y1="34" x2="600" y2="34" stroke="#1E2433" stroke-width="1" />
    <circle cx="20" cy="17" r="4.5" fill="#EF4444" opacity="0.8"/>
    <circle cx="36" cy="17" r="4.5" fill="#F59E0B" opacity="0.8"/>
    <circle cx="52" cy="17" r="4.5" fill="#10B981" opacity="0.8"/>
    <rect x="75" y="7" width="280" height="20" rx="4" fill="#080A0F" stroke="#1E2433" stroke-width="1"/>
    <text x="88" y="21" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">https://spyderman-portfolio.vercel.app // 3D RUNTIME</text>
    <rect x="490" y="8" width="90" height="18" rx="9" fill="#38BDF822" stroke="#38BDF8" stroke-width="0.75"/>
    <circle cx="502" cy="17" r="2.5" fill="#38BDF8"/>
    <text x="512" y="21" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#38BDF8">60.0 FPS GLSL</text>
  

  <!-- 3D Viewport / Wireframe Shader Mesh -->
  <g transform="translate(20, 48)">
    <rect width="360" height="292" rx="8" fill="#05070A" stroke="#1E2538"/>
    
    <!-- Coordinate Grid &amp; Camera Axis -->
    <line x1="20" y1="270" x2="340" y2="270" stroke="#161B29"/>
    <line x1="20" y1="20" x2="20" y2="270" stroke="#161B29"/>

    <!-- 3D Icosahedron / Geodesic Wireframe Sphere Mesh -->
    <g transform="translate(180, 146)">
      <!-- Outer vertices &amp; edges -->
      <polygon points="0,-90 78,-45 78,45 0,90 -78,45 -78,-45" fill="none" stroke="#E05269" stroke-width="1.5"/>
      <polygon points="0,-90 0,90 78,45 -78,-45 0,-90" fill="none" stroke="#38BDF8" stroke-width="1" opacity="0.6"/>
      <polygon points="78,-45 -78,45" fill="none" stroke="#38BDF8" stroke-width="1" opacity="0.6"/>
      
      <!-- Inner star triangulation -->
      <line x1="0" y1="-90" x2="45" y2="0" stroke="#E05269" stroke-width="1.5"/>
      <line x1="0" y1="-90" x2="-45" y2="0" stroke="#E05269" stroke-width="1.5"/>
      <line x1="0" y1="90" x2="45" y2="0" stroke="#E05269" stroke-width="1.5"/>
      <line x1="0" y1="90" x2="-45" y2="0" stroke="#E05269" stroke-width="1.5"/>
      <line x1="-78" y1="-45" x2="0" y2="-30" stroke="#38BDF8" stroke-width="1"/>
      <line x1="78" y1="-45" x2="0" y2="-30" stroke="#38BDF8" stroke-width="1"/>
      <line x1="-78" y1="45" x2="0" y2="30" stroke="#38BDF8" stroke-width="1"/>
      <line x1="78" y1="45" x2="0" y2="30" stroke="#38BDF8" stroke-width="1"/>
      
      <!-- Glowing Vertices -->
      <circle cx="0" cy="-90" r="4" fill="#E05269"/>
      <circle cx="78" cy="-45" r="4" fill="#38BDF8"/>
      <circle cx="78" cy="45" r="4" fill="#38BDF8"/>
      <circle cx="0" cy="90" r="4" fill="#E05269"/>
      <circle cx="-78" cy="45" r="4" fill="#38BDF8"/>
      <circle cx="-78" cy="-45" r="4" fill="#38BDF8"/>
      <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>
    </g>

    <!-- Overlay Stats -->
    <rect x="14" y="14" width="130" height="42" rx="4" fill="#080A0FDD" stroke="#1E2538"/>
    <text x="22" y="30" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8">DRAW CALLS: 12</text>
    <text x="22" y="46" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#10B981">60.0 FPS // 16.6ms</text>
  </g>

  <!-- Right Panel: GLSL Shader Inspector -->
  <g transform="translate(396, 48)">
    <rect width="184" height="292" rx="8" fill="url(#cardGrad7)" stroke="#1E2538"/>
    <text x="14" y="26" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#E05269">GLSL SHADER PIPELINE</text>

    <g transform="translate(12, 38)">
      <rect width="160" height="236" rx="6" fill="#080A0F" stroke="#1E2538"/>
      <text x="10" y="22" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#38BDF8">uniform float u_time;</text>
      <text x="10" y="38" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#38BDF8">uniform vec2 u_mouse;</text>
      <text x="10" y="54" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#94A3B8">varying vec3 vNormal;</text>
      <text x="10" y="76" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#F8FAFC">void main() {</text>
      <text x="18" y="94" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#E05269">  vec3 p = position;</text>
      <text x="18" y="112" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#10B981">  p.z += sin(p.x * 4.0</text>
      <text x="26" y="128" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#10B981">         + u_time);</text>
      <text x="18" y="148" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#F8FAFC">  gl_Position = </text>
      <text x="26" y="164" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#F8FAFC">    projectionMatrix *</text>
      <text x="26" y="180" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#F8FAFC">    modelViewMatrix *</text>
      <text x="26" y="196" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#38BDF8">    vec4(p, 1.0);</text>
      <text x="10" y="218" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#F8FAFC">}</text>
    </g>
  </g>
</svg>