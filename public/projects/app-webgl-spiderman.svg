<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320">
  <defs>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131B2E"/>
      <stop offset="100%" stop-color="#0B101C"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1D273D"/>
      <stop offset="100%" stop-color="#151C2C"/>
    </linearGradient>
    <linearGradient id="highlightGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#283654"/>
      <stop offset="100%" stop-color="#1B2438"/>
    </linearGradient>
  </defs>
  
  <rect width="600" height="320" fill="url(#bgGrad)"/>
  <circle cx="180" cy="160" r="150" fill="#38BDF8" opacity="0.15" filter="url(#neon)"/>

  <!-- 3D Viewport (Left) -->
  <g transform="translate(24, 18)">
    <rect width="350" height="282" rx="10" fill="#0E1626" stroke="#38BDF8" stroke-width="2"/>
    
    <g transform="translate(175, 141)">
      <!-- Outer mesh -->
      <polygon points="0,-88 78,-44 78,44 0,88 -78,44 -78,-44" fill="none" stroke="#E05269" stroke-width="3"/>
      <polygon points="0,-88 0,88 78,44 -78,-44 0,-88" fill="none" stroke="#38BDF8" stroke-width="2"/>
      <polygon points="78,-44 -78,44" fill="none" stroke="#38BDF8" stroke-width="2"/>
      
      <!-- Inner mesh -->
      <line x1="0" y1="-88" x2="44" y2="0" stroke="#E05269" stroke-width="2.5"/>
      <line x1="0" y1="-88" x2="-44" y2="0" stroke="#E05269" stroke-width="2.5"/>
      <line x1="0" y1="88" x2="44" y2="0" stroke="#E05269" stroke-width="2.5"/>
      <line x1="0" y1="88" x2="-44" y2="0" stroke="#E05269" stroke-width="2.5"/>
      
      <!-- Luminous Vertices -->
      <circle cx="0" cy="-88" r="7" fill="#E05269" filter="url(#neon)"/>
      <circle cx="78" cy="-44" r="7" fill="#38BDF8" filter="url(#neon)"/>
      <circle cx="78" cy="44" r="7" fill="#38BDF8" filter="url(#neon)"/>
      <circle cx="0" cy="88" r="7" fill="#E05269" filter="url(#neon)"/>
      <circle cx="-78" cy="44" r="7" fill="#38BDF8" filter="url(#neon)"/>
      <circle cx="-78" cy="-44" r="7" fill="#38BDF8" filter="url(#neon)"/>
      <circle cx="0" cy="0" r="8" fill="#FFFFFF"/>
    </g>

    <rect x="14" y="14" width="144" height="48" rx="6" fill="#131B2E" stroke="#38496B"/>
    <text x="24" y="32" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">DRAW CALLS: 12</text>
    <text x="24" y="50" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="bold" fill="#34D399">60.0 FPS // 16.6ms</text>
  </g>

  <!-- GLSL Shader (Right) -->
  <g transform="translate(385, 18)">
    <rect width="191" height="282" rx="10" fill="url(#cardGrad)" stroke="#38496B" stroke-width="1.5"/>
    <text x="16" y="28" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#FF8BA7">GLSL SHADER PIPELINE</text>

    <g transform="translate(14, 42)">
      <rect width="163" height="222" rx="6" fill="#131B2E" stroke="#38496B"/>
      <text x="10" y="24" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38BDF8">uniform float u_time;</text>
      <text x="10" y="44" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38BDF8">uniform vec2 u_mouse;</text>
      <text x="10" y="64" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">varying vec3 vNormal;</text>
      <text x="10" y="90" font-family="'JetBrains Mono', monospace" font-size="10" fill="#FFFFFF">void main() {</text>
      <text x="18" y="110" font-family="'JetBrains Mono', monospace" font-size="10" fill="#FF8BA7">  vec3 p = position;</text>
      <text x="18" y="130" font-family="'JetBrains Mono', monospace" font-size="10" fill="#34D399">  p.z += sin(p.x * 4.0</text>
      <text x="26" y="148" font-family="'JetBrains Mono', monospace" font-size="10" fill="#34D399">         + u_time);</text>
      <text x="18" y="170" font-family="'JetBrains Mono', monospace" font-size="10" fill="#FFFFFF">  gl_Position = </text>
      <text x="26" y="188" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38BDF8">    proj * mv * vec4;</text>
      <text x="10" y="210" font-family="'JetBrains Mono', monospace" font-size="10" fill="#FFFFFF">}</text>
    </g>
  </g>

</svg>