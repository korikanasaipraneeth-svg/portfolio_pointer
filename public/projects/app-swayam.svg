<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="cardGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121622"/>
      <stop offset="100%" stop-color="#0A0C13"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="#080A0F"/>
  
    <rect x="0" y="0" width="600" height="34" fill="#0E111A" />
    <line x1="0" y1="34" x2="600" y2="34" stroke="#1E2433" stroke-width="1" />
    <circle cx="20" cy="17" r="4.5" fill="#EF4444" opacity="0.8"/>
    <circle cx="36" cy="17" r="4.5" fill="#F59E0B" opacity="0.8"/>
    <circle cx="52" cy="17" r="4.5" fill="#10B981" opacity="0.8"/>
    <rect x="75" y="7" width="280" height="20" rx="4" fill="#080A0F" stroke="#1E2433" stroke-width="1"/>
    <text x="88" y="21" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">https://swayam.org // BLOOD &amp; ORGAN DISPATCH</text>
    <rect x="490" y="8" width="90" height="18" rx="9" fill="#EF444422" stroke="#EF4444" stroke-width="0.75"/>
    <circle cx="502" cy="17" r="2.5" fill="#EF4444"/>
    <text x="512" y="21" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#EF4444">EMERGENCY READY</text>
  

  <!-- 4 Blood Group Inventory Gauges -->
  <g transform="translate(20, 48)">
    <!-- O- (Critical) -->
    <rect width="130" height="110" rx="8" fill="url(#cardGrad3)" stroke="#EF4444" stroke-width="1.5"/>
    <circle cx="65" cy="48" r="28" fill="#EF444415" stroke="#EF4444" stroke-width="2"/>
    <text x="56" y="55" font-family="'Inter', sans-serif" font-size="18" font-weight="900" fill="#EF4444">O-</text>
    <text x="28" y="94" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#EF4444">4 UNITS CRITICAL</text>

    <!-- O+ (Normal) -->
    <rect x="142" width="130" height="110" rx="8" fill="url(#cardGrad3)" stroke="#1E2538"/>
    <circle cx="207" cy="48" r="28" fill="#10B98115" stroke="#10B981" stroke-width="2"/>
    <text x="198" y="55" font-family="'Inter', sans-serif" font-size="18" font-weight="900" fill="#10B981">O+</text>
    <text x="174" y="94" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10B981">42 UNITS AVAIL</text>

    <!-- A+ (Normal) -->
    <rect x="284" width="130" height="110" rx="8" fill="url(#cardGrad3)" stroke="#1E2538"/>
    <circle cx="349" cy="48" r="28" fill="#38BDF815" stroke="#38BDF8" stroke-width="2"/>
    <text x="341" y="55" font-family="'Inter', sans-serif" font-size="18" font-weight="900" fill="#38BDF8">A+</text>
    <text x="316" y="94" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38BDF8">28 UNITS AVAIL</text>

    <!-- B+ (Normal) -->
    <rect x="426" width="134" height="110" rx="8" fill="url(#cardGrad3)" stroke="#1E2538"/>
    <circle cx="493" cy="48" r="28" fill="#A855F715" stroke="#A855F7" stroke-width="2"/>
    <text x="485" y="55" font-family="'Inter', sans-serif" font-size="18" font-weight="900" fill="#A855F7">B+</text>
    <text x="460" y="94" font-family="'JetBrains Mono', monospace" font-size="10" fill="#A855F7">36 UNITS AVAIL</text>
  </g>

  <!-- Live Emergency Dispatch Log -->
  <g transform="translate(20, 170)">
    <rect width="560" height="170" rx="8" fill="url(#cardGrad3)" stroke="#1E2538"/>
    <text x="20" y="26" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#F8FAFC">ACTIVE SOS DISPATCH FEEDS</text>
    
    <!-- Feed Item 1 -->
    <g transform="translate(20, 42)">
      <rect width="520" height="50" rx="6" fill="#EF444415" stroke="#EF4444" stroke-width="1"/>
      <circle cx="20" cy="25" r="5" fill="#EF4444"/>
      <text x="35" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#F8FAFC">CRITICAL SOS: 2 Units O- Required</text>
      <text x="35" y="38" font-family="'JetBrains Mono', monospace" font-size="10" fill="#EF4444">Apollo Trauma Ward • Matching 3 nearby verified donors (ETA 14m)</text>
      <rect x="430" y="13" width="75" height="24" rx="4" fill="#EF4444" />
      <text x="444" y="29" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="bold" fill="#FFFFFF">DISPATCH</text>
    </g>

    <!-- Feed Item 2 -->
    <g transform="translate(20, 102)">
      <rect width="520" height="50" rx="6" fill="#080A0F" stroke="#1E2538"/>
      <circle cx="20" cy="25" r="5" fill="#10B981"/>
      <text x="35" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#F8FAFC">TRANSIT CONFIRMED: 1 Unit A+ in Route</text>
      <text x="35" y="38" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10B981">Courier #882 • Secure Cold Storage Chain Maintained (3.8°C)</text>
      <rect x="430" y="13" width="75" height="24" rx="4" fill="#10B98122" stroke="#10B981"/>
      <text x="446" y="29" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="bold" fill="#10B981">TRACKING</text>
    </g>
  </g>
</svg>