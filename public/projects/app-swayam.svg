<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320">
  <defs>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131B2E"/>
      <stop offset="100%" stop-color="#0B101C"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1D273D"/>
      <stop offset="100%" stop-color="#151C2C"/>
    </linearGradient>
    <linearGradient id="highlightGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#283654"/>
      <stop offset="100%" stop-color="#1B2438"/>
    </linearGradient>
  </defs>
  
  <rect width="600" height="320" fill="url(#bgGrad)"/>
  <circle cx="80" cy="80" r="140" fill="#EF4444" opacity="0.15" filter="url(#neon)"/>

  <!-- 4 Vivid Blood Inventory Cards -->
  <g transform="translate(24, 18)">
    <!-- O- (Critical) -->
    <rect width="128" height="126" rx="10" fill="#2E0A0F" stroke="#EF4444" stroke-width="2.5"/>
    <circle cx="64" cy="50" r="34" fill="#EF444440" stroke="#EF4444" stroke-width="3"/>
    <text x="48" y="59" font-family="'Inter', sans-serif" font-size="26" font-weight="900" fill="#FFFFFF">O-</text>
    <text x="16" y="104" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#FF8BA7">4 UNITS CRITICAL</text>
    <rect x="16" y="110" width="96" height="6" rx="3" fill="#EF4444"/>

    <!-- O+ (Normal) -->
    <rect x="141" width="128" height="126" rx="10" fill="url(#cardGrad)" stroke="#38496B" stroke-width="1.5"/>
    <circle cx="205" cy="50" r="34" fill="#10B98130" stroke="#10B981" stroke-width="2.5"/>
    <text x="189" y="59" font-family="'Inter', sans-serif" font-size="26" font-weight="900" fill="#34D399">O+</text>
    <text x="162" y="104" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#34D399">42 UNITS AVAIL</text>
    <rect x="159" y="110" width="96" height="6" rx="3" fill="#10B981"/>

    <!-- A+ (Normal) -->
    <rect x="282" width="128" height="126" rx="10" fill="url(#cardGrad)" stroke="#38496B" stroke-width="1.5"/>
    <circle cx="346" cy="50" r="34" fill="#38BDF830" stroke="#38BDF8" stroke-width="2.5"/>
    <text x="331" y="59" font-family="'Inter', sans-serif" font-size="26" font-weight="900" fill="#38BDF8">A+</text>
    <text x="303" y="104" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#38BDF8">28 UNITS AVAIL</text>
    <rect x="300" y="110" width="96" height="6" rx="3" fill="#38BDF8"/>

    <!-- B+ (Normal) -->
    <rect x="424" width="128" height="126" rx="10" fill="url(#cardGrad)" stroke="#38496B" stroke-width="1.5"/>
    <circle cx="488" cy="50" r="34" fill="#A855F730" stroke="#A855F7" stroke-width="2.5"/>
    <text x="473" y="59" font-family="'Inter', sans-serif" font-size="26" font-weight="900" fill="#C084FC">B+</text>
    <text x="445" y="104" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#C084FC">36 UNITS AVAIL</text>
    <rect x="442" y="110" width="96" height="6" rx="3" fill="#A855F7"/>
  </g>

  <!-- Emergency Dispatch Log -->
  <g transform="translate(24, 158)">
    <rect width="552" height="142" rx="10" fill="url(#highlightGrad)" stroke="#38496B" stroke-width="1.5"/>
    
    <g transform="translate(18, 16)">
      <rect width="516" height="52" rx="6" fill="#3D0C13" stroke="#EF4444" stroke-width="1.8"/>
      <circle cx="26" cy="26" r="8" fill="#EF4444"/>
      <text x="46" y="25" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">CRITICAL SOS: 2 Units O- Required Immediately</text>
      <text x="46" y="43" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="bold" fill="#FF8BA7">Apollo Trauma ICU • 3 nearby verified donors alerted (ETA 14m)</text>
      <rect x="416" y="11" width="90" height="30" rx="4" fill="#EF4444"/>
      <text x="428" y="30" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="bold" fill="#FFFFFF">DISPATCH</text>
    </g>

    <g transform="translate(18, 76)">
      <rect width="516" height="52" rx="6" fill="#10251B" stroke="#10B981" stroke-width="1.5"/>
      <circle cx="26" cy="26" r="8" fill="#10B981"/>
      <text x="46" y="25" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">TRANSIT CONFIRMED: 1 Unit A+ En Route</text>
      <text x="46" y="43" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#34D399">Courier #882 • Secure Cold Storage Monitored (3.8°C)</text>
      <rect x="416" y="11" width="90" height="30" rx="4" fill="#10B981"/>
      <text x="428" y="30" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="bold" fill="#022C1A">TRACKING</text>
    </g>
  </g>

</svg>