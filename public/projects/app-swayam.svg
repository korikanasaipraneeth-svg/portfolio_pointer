<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <linearGradient id="bgSwayam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161219"/>
      <stop offset="100%" stop-color="#0B090F"/>
    </linearGradient>
    <linearGradient id="panelSwayam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#241B26"/>
      <stop offset="100%" stop-color="#18121B"/>
    </linearGradient>
  </defs>

  <rect width="600" height="340" fill="url(#bgSwayam)"/>

  <!-- Top App Window Bar -->
  <g transform="translate(0, 0)">
    <rect width="600" height="36" fill="#0E0A12" stroke="#2D1F33" stroke-width="1"/>
    <circle cx="20" cy="18" r="4.5" fill="#EF4444"/>
    <circle cx="36" cy="18" r="4.5" fill="#F59E0B"/>
    <circle cx="52" cy="18" r="4.5" fill="#10B981"/>

    <rect x="140" y="8" width="320" height="20" rx="10" fill="#1A1421" stroke="#33243B" stroke-width="1"/>
    <text x="300" y="22" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#94A3B8" text-anchor="middle">swayam.org/emergency-dispatch-console</text>

    <rect x="480" y="8" width="105" height="20" rx="10" fill="#4C0519" stroke="#E11D48" stroke-width="1"/>
    <circle cx="492" cy="18" r="3" fill="#FB7185"/>
    <text x="537" y="22" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#FDA4AF" text-anchor="middle">LIVE DISPATCH</text>
  </g>

  <!-- Blood Inventory Category Cards (Top Row) -->
  <g transform="translate(18, 48)">
    <!-- O- (CRITICAL) -->
    <g transform="translate(0, 0)">
      <rect width="105" height="74" rx="10" fill="#2E1218" stroke="#E11D48" stroke-width="1.5"/>
      <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="900" fill="#FB7185">O- NEG</text>
      <text x="12" y="44" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="bold" fill="#FFFFFF">2 Units</text>
      <text x="12" y="62" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#EF4444">● CRITICAL DEFICIT</text>
    </g>

    <!-- O+ -->
    <g transform="translate(115, 0)">
      <rect width="105" height="74" rx="10" fill="url(#panelSwayam)" stroke="#382940" stroke-width="1"/>
      <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="900" fill="#94A3B8">O+ POS</text>
      <text x="12" y="44" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="bold" fill="#FFFFFF">38 Units</text>
      <text x="12" y="62" font-family="'Inter', sans-serif" font-size="9" fill="#34D399">● Reserve Normal</text>
    </g>

    <!-- A+ -->
    <g transform="translate(230, 0)">
      <rect width="105" height="74" rx="10" fill="url(#panelSwayam)" stroke="#382940" stroke-width="1"/>
      <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="900" fill="#94A3B8">A+ POS</text>
      <text x="12" y="44" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="bold" fill="#FFFFFF">24 Units</text>
      <text x="12" y="62" font-family="'Inter', sans-serif" font-size="9" fill="#34D399">● Reserve Normal</text>
    </g>

    <!-- B+ -->
    <g transform="translate(345, 0)">
      <rect width="105" height="74" rx="10" fill="url(#panelSwayam)" stroke="#382940" stroke-width="1"/>
      <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="900" fill="#94A3B8">B+ POS</text>
      <text x="12" y="44" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="bold" fill="#FFFFFF">42 Units</text>
      <text x="12" y="62" font-family="'Inter', sans-serif" font-size="9" fill="#34D399">● High Capacity</text>
    </g>

    <!-- AB+ -->
    <g transform="translate(460, 0)">
      <rect width="104" height="74" rx="10" fill="url(#panelSwayam)" stroke="#382940" stroke-width="1"/>
      <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="900" fill="#94A3B8">AB+ POS</text>
      <text x="12" y="44" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="bold" fill="#FFFFFF">16 Units</text>
      <text x="12" y="62" font-family="'Inter', sans-serif" font-size="9" fill="#34D399">● Reserve Normal</text>
    </g>
  </g>

  <!-- Live Emergency Dispatch Banner & Match Status -->
  <g transform="translate(18, 132)">
    <rect width="564" height="192" rx="12" fill="url(#panelSwayam)" stroke="#382940" stroke-width="1"/>

    <!-- Header Row -->
    <g transform="translate(16, 16)">
      <text x="0" y="0" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Active Trauma Case #SW-9024</text>
      <text x="0" y="16" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#FB7185">CRITICAL EMERGENCY DISPATCH · SURGERY UNIT 3</text>
    </g>

    <!-- Two-Col Info -->
    <!-- Left: Hospital & Case Info -->
    <g transform="translate(16, 52)">
      <rect width="260" height="116" rx="8" fill="#130E17" stroke="#2E1B2B"/>
      
      <g transform="translate(12, 18)">
        <text x="0" y="0" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8">Hospital &amp; Location</text>
        <text x="0" y="15" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">City Care General • Trauma ICU</text>

        <text x="0" y="40" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8">Requirement</text>
        <text x="0" y="55" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#FB7185">2 Units O- Negative (Immediate)</text>

        <text x="0" y="80" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8">Platform Match Time</text>
        <text x="0" y="94" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#34D399">Matched in 3.4 mins ✓</text>
      </g>
    </g>

    <!-- Right: Matched Donor & Transit Status -->
    <g transform="translate(288, 52)">
      <rect width="260" height="116" rx="8" fill="#130E17" stroke="#2E1B2B"/>

      <g transform="translate(12, 18)">
        <text x="0" y="0" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8">Matched Verified Donor</text>
        <text x="0" y="15" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">Donor #D-3081 (1.8 km distance)</text>

        <text x="0" y="40" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8">Dispatch Response</text>
        <text x="0" y="55" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#34D399">Confirmed via Mobile App ✓</text>

        <text x="0" y="80" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8">Courier &amp; Delivery Progress</text>
        <text x="0" y="94" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#38BDF8">TRANSIT ACTIVE • ETA 11 MINS</text>
      </g>
    </g>
  </g>
</svg>