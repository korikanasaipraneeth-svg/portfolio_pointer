<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320">
  <defs>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131B2E"/>
      <stop offset="100%" stop-color="#0B101C"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1D273D"/>
      <stop offset="100%" stop-color="#151C2C"/>
    </linearGradient>
    <linearGradient id="highlightGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#283654"/>
      <stop offset="100%" stop-color="#1B2438"/>
    </linearGradient>
  </defs>
  
  <rect width="600" height="320" fill="url(#bgGrad)"/>
  <circle cx="300" cy="140" r="160" fill="#F59E0B" opacity="0.12" filter="url(#neon)"/>

  <!-- Golden Hackathon Trophy Banner -->
  <g transform="translate(24, 18)">
    <rect width="552" height="54" rx="8" fill="#2E2008" stroke="#F59E0B" stroke-width="2"/>
    <text x="24" y="34" font-family="'Inter', sans-serif" font-size="16" font-weight="900" fill="#FCD34D">🏆 1ST PRIZE — GOOGLE STUDENT AMBASSADOR HACKATHON</text>
    <rect x="415" y="13" width="122" height="28" rx="4" fill="#F59E0B" stroke="#FCD34D" stroke-width="1"/>
    <text x="425" y="31" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="bold" fill="#000000">VERIFIED WINNER</text>
  </g>

  <!-- 3-Column Verification Dashboard -->
  <g transform="translate(24, 84)">
    <!-- Column 1: Candidates -->
    <rect width="175" height="216" rx="8" fill="url(#cardGrad)" stroke="#38496B" stroke-width="1.5"/>
    <text x="14" y="26" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#38BDF8">PROFILES (450+)</text>
    
    <g transform="translate(12, 40)">
      <rect width="151" height="74" rx="6" fill="#131B2E" stroke="#38496B"/>
      <text x="12" y="22" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Sai Praneeth</text>
      <text x="12" y="39" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#38BDF8">Full-Stack AI Dev</text>
      <rect x="12" y="48" width="44" height="20" rx="3" fill="#38BDF830" stroke="#38BDF8"/>
      <text x="18" y="62" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="bold" fill="#38BDF8">React</text>
      <rect x="62" y="48" width="50" height="20" rx="3" fill="#10B98130" stroke="#10B981"/>
      <text x="68" y="62" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="bold" fill="#10B981">Python</text>
    </g>

    <g transform="translate(12, 124)">
      <rect width="151" height="74" rx="6" fill="#131B2E" stroke="#38496B"/>
      <text x="12" y="22" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Rahul Varma</text>
      <text x="12" y="39" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#94A3B8">Backend Architect</text>
      <rect x="12" y="48" width="54" height="20" rx="3" fill="#A855F730" stroke="#A855F7"/>
      <text x="18" y="62" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="bold" fill="#C084FC">FastAPI</text>
    </g>

    <!-- Column 2: Faculty Verification Seal (Big Glowing Green) -->
    <g transform="translate(188, 0)">
      <rect width="175" height="216" rx="8" fill="#0C2417" stroke="#10B981" stroke-width="2.5"/>
      <text x="14" y="26" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#34D399">FACULTY VERIFIED (320 ✓)</text>
      
      <g transform="translate(12, 40)">
        <rect width="151" height="154" rx="6" fill="#07190F" stroke="#10B981"/>
        <circle cx="75" cy="45" r="28" fill="#10B98140" stroke="#34D399" stroke-width="3"/>
        <text x="62" y="55" font-family="'Inter', sans-serif" font-size="28" font-weight="900" fill="#34D399">✓</text>
        
        <text x="16" y="96" font-family="'Inter', sans-serif" font-size="13.5" font-weight="bold" fill="#FFFFFF">Institutional Audit</text>
        <text x="16" y="114" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#A7F3D0">Dean Signature Pass</text>

        <rect x="14" y="122" width="123" height="26" rx="4" fill="#10B981"/>
        <text x="20" y="139" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="bold" fill="#000000">CREDENTIAL PASS</text>
      </g>
    </g>

    <!-- Column 3: Recruiters -->
    <g transform="translate(376, 0)">
      <rect width="176" height="216" rx="8" fill="url(#cardGrad)" stroke="#38496B" stroke-width="1.5"/>
      <text x="14" y="26" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#38BDF8">RECRUITERS (84)</text>
      
      <g transform="translate(12, 40)">
        <rect width="152" height="74" rx="6" fill="#131B2E" stroke="#38BDF8"/>
        <text x="12" y="22" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Google Cloud Team</text>
        <text x="12" y="39" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="bold" fill="#34D399">Round 2: Systems Design</text>
        <text x="12" y="59" font-family="'JetBrains Mono', monospace" font-size="10" fill="#CBD5E1">Fri 2:00 PM Confirmed</text>
      </g>
    </g>
  </g>

</svg>