    <rect x="338" y="12" width="92" height="54" rx="6" fill="#131B2E" stroke="#38496B"/>
    <text x="358" y="34" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#94A3B8">THU 07</text>
    <text x="356" y="52" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">8 SLOTS</text>

    <rect x="442" y="12" width="92" height="54" rx="6" fill="#131B2E" stroke="#38496B"/>
    <text x="462" y="34" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#94A3B8">FRI 08</text>
    <text x="460" y="52" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">5 SLOTS</text>
  </g>

