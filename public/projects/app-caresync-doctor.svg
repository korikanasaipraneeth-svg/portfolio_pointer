<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <linearGradient id="bgCare" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E1624"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>
    <linearGradient id="panelCare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141E30"/>
      <stop offset="100%" stop-color="#0E1624"/>
    </linearGradient>
  </defs>

  <rect width="600" height="340" fill="url(#bgCare)"/>

  <!-- Top App Window Bar -->
  <g transform="translate(0, 0)">
    <rect width="600" height="36" fill="#0A0E18" stroke="#1E293B" stroke-width="1"/>
    <circle cx="20" cy="18" r="4.5" fill="#EF4444"/>
    <circle cx="36" cy="18" r="4.5" fill="#F59E0B"/>
    <circle cx="52" cy="18" r="4.5" fill="#10B981"/>

    <rect x="140" y="8" width="320" height="20" rx="10" fill="#131B2B" stroke="#223048" stroke-width="1"/>
    <text x="300" y="22" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#94A3B8" text-anchor="middle">caresync.health/clinical-portal</text>

    <rect x="475" y="8" width="110" height="20" rx="10" fill="#064E3B" stroke="#059669" stroke-width="1"/>
    <circle cx="487" cy="18" r="3" fill="#34D399"/>
    <text x="537" y="22" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#34D399" text-anchor="middle">CLINIC OPEN</text>
  </g>

  <!-- Split Clinical Dashboard -->
  <!-- Left Side: Doctor Appointment Queue (285 width) -->
  <g transform="translate(18, 48)">
    <rect width="280" height="276" rx="12" fill="url(#panelCare)" stroke="#223552" stroke-width="1"/>

    <g transform="translate(16, 16)">
      <text x="0" y="0" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">Clinical Appointment Queue</text>
      <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10B981">Dr. S. Rao, MD • 14 Scheduled Today</text>
    </g>

    <!-- Appointment Rows -->
    <g transform="translate(16, 44)">
      <!-- Appt 1 (Active Video) -->
      <g transform="translate(0, 0)">
        <rect width="248" height="64" rx="8" fill="#102336" stroke="#0284C7" stroke-width="1.2"/>
        <g transform="translate(10, 16)">
          <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#38BDF8">10:00 AM • TELEHEALTH VIDEO</text>
          <text x="0" y="16" font-family="'Inter', sans-serif" font-size="11.5" font-weight="bold" fill="#FFFFFF">Patient #P-1082 (Follow-up)</text>
          <rect x="160" y="-4" width="68" height="22" rx="4" fill="#0284C7"/>
          <text x="194" y="11" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">JOIN CALL</text>
        </g>
      </g>

      <!-- Appt 2 (In Clinic) -->
      <g transform="translate(0, 74)">
        <rect width="248" height="64" rx="8" fill="#0C1422" stroke="#1D2A42"/>
        <g transform="translate(10, 16)">
          <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#94A3B8">10:30 AM • IN-CLINIC VISIT</text>
          <text x="0" y="16" font-family="'Inter', sans-serif" font-size="11.5" font-weight="bold" fill="#FFFFFF">Patient #P-1083 (Routine Check)</text>
          <rect x="160" y="-4" width="68" height="22" rx="4" fill="#064E3B"/>
          <text x="194" y="11" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" fill="#34D399" text-anchor="middle">CONFIRMED</text>
        </g>
      </g>

      <!-- Appt 3 -->
      <g transform="translate(0, 148)">
        <rect width="248" height="64" rx="8" fill="#0C1422" stroke="#1D2A42"/>
        <g transform="translate(10, 16)">
          <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#94A3B8">11:00 AM • DIAGNOSTIC REVIEW</text>
          <text x="0" y="16" font-family="'Inter', sans-serif" font-size="11.5" font-weight="bold" fill="#FFFFFF">Patient #P-1084 (Cardio Labs)</text>
          <rect x="160" y="-4" width="68" height="22" rx="4" fill="#1E293B"/>
          <text x="194" y="11" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#94A3B8" text-anchor="middle">QUEUED</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Right Side: Digital EHR & Telehealth Prescription Console (275 width) -->
  <g transform="translate(308, 48)">
    <rect width="274" height="276" rx="12" fill="url(#panelCare)" stroke="#223552" stroke-width="1"/>

    <g transform="translate(16, 16)">
      <text x="0" y="0" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">Electronic Health Record (EHR)</text>
      <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38BDF8">FastAPI + MySQL Encrypted HIPAA</text>
    </g>

    <!-- Digital Prescription Box -->
    <g transform="translate(16, 44)">
      <rect width="242" height="154" rx="8" fill="#0C1422" stroke="#1D2A42"/>
      <g transform="translate(12, 18)">
        <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#94A3B8">DIGITAL RX CERTIFICATE</text>
        <text x="0" y="18" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">Amlodipine Besylate 5mg</text>
        <text x="0" y="34" font-family="'Inter', sans-serif" font-size="9" fill="#34D399">Dosage: 1 Tablet Daily After Meals</text>

        <line x1="0" y1="46" x2="218" y2="46" stroke="#1E293B"/>

        <text x="0" y="62" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8">Clinical Diagnosis Notes:</text>
        <text x="0" y="78" font-family="'Inter', sans-serif" font-size="9.5" fill="#F1F5F9">Mild essential hypertension. Vitals</text>
        <text x="0" y="92" font-family="'Inter', sans-serif" font-size="9.5" fill="#F1F5F9">stable. Re-evaluate in 2 weeks.</text>

        <rect x="0" y="104" width="218" height="22" rx="4" fill="#064E3B"/>
        <text x="109" y="119" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold" fill="#34D399" text-anchor="middle">✓ DIGITALLY SIGNED &amp; VERIFIED</text>
      </g>
    </g>

    <!-- Appointment Booking CTA Status -->
    <g transform="translate(16, 210)">
      <rect width="242" height="42" rx="8" fill="#0D1A2B" stroke="#0284C7"/>
      <text x="12" y="18" font-family="'Inter', sans-serif" font-size="9" fill="#38BDF8">Online Patient Portal Sync</text>
      <text x="12" y="32" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="bold" fill="#FFFFFF">Instant Booking &amp; Slot Confirmation ✓</text>
    </g>
  </g>
</svg>