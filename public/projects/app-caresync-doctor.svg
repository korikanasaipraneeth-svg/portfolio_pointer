      <text x="16" y="26" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#34D399">DIGITAL RX SUMMARY</text>
      
      <rect x="14" y="42" width="188" height="90" rx="6" fill="#131B2E" stroke="#38496B"/>
      <text x="12" y="22" font-family="'Inter', sans-serif" font-size="13.5" font-weight="bold" fill="#FFFFFF">Dr. K. Anand MD</text>
      <text x="12" y="44" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#E2E8F0">• Cetirizine 10mg — 1-0-1</text>
      <text x="12" y="62" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#E2E8F0">• Paracetamol 650mg — SOS</text>
      <text x="12" y="80" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="bold" fill="#34D399">Signed via Cryptographic Key</text>
      
      <rect x="14" y="142" width="188" height="38" rx="6" fill="#10B981" stroke="#34D399"/>
      <text x="34" y="166" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="bold" fill="#022C1A">DOWNLOAD PDF RX</text>
