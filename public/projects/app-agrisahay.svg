<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <linearGradient id="bgAgri" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E1912"/>
      <stop offset="100%" stop-color="#080F0A"/>
    </linearGradient>
    <linearGradient id="panelAgri" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15261B"/>
      <stop offset="100%" stop-color="#0E1A13"/>
    </linearGradient>
  </defs>

  <rect width="600" height="340" fill="url(#bgAgri)"/>

  <!-- Top App Window Bar -->
  <g transform="translate(0, 0)">
    <rect width="600" height="36" fill="#0A0E18" stroke="#1E293B" stroke-width="1"/>
    <circle cx="20" cy="18" r="4.5" fill="#EF4444"/>
    <circle cx="36" cy="18" r="4.5" fill="#F59E0B"/>
    <circle cx="52" cy="18" r="4.5" fill="#10B981"/>

    <rect x="140" y="8" width="320" height="20" rx="10" fill="#122118" stroke="#1F3D2A" stroke-width="1"/>
    <text x="300" y="22" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#94A3B8" text-anchor="middle">agrisahay.ai/crop-pathology-scanner</text>

    <rect x="475" y="8" width="110" height="20" rx="10" fill="#064E3B" stroke="#059669" stroke-width="1"/>
    <circle cx="487" cy="18" r="3" fill="#34D399"/>
    <text x="537" y="22" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#34D399" text-anchor="middle">OPENCV + AI</text>
  </g>

  <!-- Main Interface -->
  <!-- Left Side: Computer Vision Leaf Scanner (310 width) -->
  <g transform="translate(18, 48)">
    <rect width="305" height="276" rx="12" fill="url(#panelAgri)" stroke="#1F3D2A" stroke-width="1"/>

    <!-- Header -->
    <g transform="translate(16, 16)">
      <text x="0" y="0" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">Crop Vision Pathology Scanner</text>
      <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10B981">OpenCV 4 + Gemini Multimodal Vision API</text>
    </g>

    <!-- Scan Reticle Viewport -->
    <g transform="translate(16, 44)">
      <rect width="273" height="135" rx="8" fill="#08120C" stroke="#1A3323"/>

      <!-- Stylized Leaf Vector -->
      <path d="M50 110 C40 50, 110 30, 190 20 C210 60, 200 110, 120 125 C80 130, 60 120, 50 110 Z" fill="#166534" fill-opacity="0.4" stroke="#22C55E" stroke-width="1.5"/>
      <path d="M50 110 Q120 70 190 20" stroke="#4ADE80" stroke-width="1.5" fill="none"/>
      <!-- Veins -->
      <line x1="90" y1="90" x2="110" y2="70" stroke="#4ADE80" stroke-width="1" stroke-opacity="0.6"/>
      <line x1="120" y1="75" x2="150" y2="60" stroke="#4ADE80" stroke-width="1" stroke-opacity="0.6"/>
      <line x1="140" y1="58" x2="170" y2="45" stroke="#4ADE80" stroke-width="1" stroke-opacity="0.6"/>

      <!-- Pathology Detection Bounding Box -->
      <rect x="95" y="45" width="70" height="50" rx="4" fill="none" stroke="#EF4444" stroke-width="1.8" stroke-dasharray="4 2"/>
      <rect x="95" y="32" width="70" height="14" rx="2" fill="#991B1B"/>
      <text x="130" y="42" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="bold" fill="#FEE2E2" text-anchor="middle">LESION DETECTED</text>
    </g>

    <!-- Diagnosis Banner -->
    <g transform="translate(16, 190)">
      <rect width="273" height="74" rx="8" fill="#140D0F" stroke="#991B1B" stroke-width="1"/>
      <g transform="translate(12, 18)">
        <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#F87171">PRIMARY PATHOLOGY IDENTIFIED</text>
        <text x="0" y="20" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">Early Blight (Alternaria Solani)</text>
        <text x="0" y="40" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="bold" fill="#34D399">Confidence: 98.2% Accuracy ✓</text>
      </g>
    </g>
  </g>

  <!-- Right Side: Treatment Protocols & Soil Telemetry (250 width) -->
  <g transform="translate(333, 48)">
    <rect width="249" height="276" rx="12" fill="url(#panelAgri)" stroke="#1F3D2A" stroke-width="1"/>

    <g transform="translate(14, 16)">
      <text x="0" y="0" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">Actionable Treatment Plan</text>
      <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38BDF8">Gemini AI Agricultural Advisory</text>
    </g>

    <!-- Treatment Steps -->
    <g transform="translate(14, 46)">
      <rect width="221" height="96" rx="8" fill="#0A140E" stroke="#1A3323"/>
      <g transform="translate(10, 16)">
        <text x="0" y="0" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8">Recommended Fungicide</text>
        <text x="0" y="16" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">Copper Oxychloride (2.5g / Liter)</text>

        <text x="0" y="38" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8">Application Timing</text>
        <text x="0" y="54" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="bold" fill="#34D399">Spray within 24 hours at dawn</text>

        <text x="0" y="74" font-family="'Inter', sans-serif" font-size="8.5" fill="#FBBF24">⚠ Keep 15 days pre-harvest interval</text>
      </g>
    </g>

    <!-- Soil Sensor Telemetry -->
    <g transform="translate(14, 154)">
      <text x="0" y="10" font-family="'Inter', sans-serif" font-size="9" font-weight="bold" fill="#94A3B8">FIELD TELEMETRY SENSORS</text>

      <g transform="translate(0, 20)">
        <!-- Metric 1: Moisture -->
        <g transform="translate(0, 0)">
          <rect width="105" height="42" rx="6" fill="#0A140E" stroke="#1A3323"/>
          <text x="8" y="16" font-family="'Inter', sans-serif" font-size="8.5" fill="#94A3B8">Soil Moisture</text>
          <text x="8" y="34" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#38BDF8">64% (Good)</text>
        </g>

        <!-- Metric 2: pH -->
        <g transform="translate(115, 0)">
          <rect width="106" height="42" rx="6" fill="#0A140E" stroke="#1A3323"/>
          <text x="8" y="16" font-family="'Inter', sans-serif" font-size="8.5" fill="#94A3B8">Soil pH Level</text>
          <text x="8" y="34" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#34D399">6.5 (Optimal)</text>
        </g>

        <!-- Metric 3: Temp -->
        <g transform="translate(0, 48)">
          <rect width="105" height="42" rx="6" fill="#0A140E" stroke="#1A3323"/>
          <text x="8" y="16" font-family="'Inter', sans-serif" font-size="8.5" fill="#94A3B8">Ambient Temp</text>
          <text x="8" y="34" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#F1F5F9">28.4°C</text>
        </g>

        <!-- Metric 4: Nitrogen -->
        <g transform="translate(115, 48)">
          <rect width="106" height="42" rx="6" fill="#0A140E" stroke="#1A3323"/>
          <text x="8" y="16" font-family="'Inter', sans-serif" font-size="8.5" fill="#94A3B8">Nitrogen (N)</text>
          <text x="8" y="34" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#A855F7">142 mg/kg</text>
        </g>
      </g>
    </g>
  </g>
</svg>