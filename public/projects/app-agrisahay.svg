<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320">
  <defs>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131B2E"/>
      <stop offset="100%" stop-color="#0B101C"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1D273D"/>
      <stop offset="100%" stop-color="#151C2C"/>
    </linearGradient>
    <linearGradient id="highlightGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#283654"/>
      <stop offset="100%" stop-color="#1B2438"/>
    </linearGradient>
  </defs>
  
  <rect width="600" height="320" fill="url(#bgGrad)"/>
  <circle cx="180" cy="160" r="140" fill="#22C55E" opacity="0.15" filter="url(#neon)"/>

  <!-- Agricultural Scanner Viewport (Left) -->
  <g transform="translate(24, 18)">
    <rect width="330" height="282" rx="10" fill="#0C1F13" stroke="#22C55E" stroke-width="2"/>
    
    <line x1="165" y1="20" x2="165" y2="262" stroke="#1E472B" stroke-width="2" stroke-dasharray="4,4"/>
    <line x1="20" y1="141" x2="310" y2="141" stroke="#1E472B" stroke-width="2" stroke-dasharray="4,4"/>

    <!-- Vivid Leaf Silhouette -->
    <path d="M 65 210 Q 165 35 265 190 C 225 240 105 250 65 210 Z" fill="#22C55E" opacity="0.85"/>
    <path d="M 165 65 Q 165 170 165 235" stroke="#BBF7D0" stroke-width="3.5"/>
    <path d="M 165 105 Q 115 125 85 145" stroke="#BBF7D0" stroke-width="3"/>
    <path d="M 165 135 Q 215 155 245 175" stroke="#BBF7D0" stroke-width="3"/>

    <!-- AI Bounding Box -->
    <rect x="85" y="90" width="150" height="85" rx="4" fill="#EF444435" stroke="#EF4444" stroke-width="3"/>
    <rect x="85" y="66" width="150" height="26" rx="3" fill="#EF4444"/>
    <text x="94" y="84" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#FFFFFF">EARLY BLIGHT 94.2%</text>

    <!-- Scanning Laser -->
    <line x1="20" y1="150" x2="310" y2="150" stroke="#4ADE80" stroke-width="4" filter="url(#neon)"/>
  </g>

  <!-- Gemini Multimodal AI Panel -->
  <g transform="translate(370, 18)">
    <rect width="206" height="282" rx="10" fill="url(#cardGrad)" stroke="#38496B" stroke-width="1.5"/>
    <text x="18" y="28" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="bold" fill="#38BDF8">GEMINI MULTIMODAL AI</text>

    <g transform="translate(14, 42)">
      <rect width="178" height="92" rx="6" fill="#131B2E" stroke="#38496B"/>
      <text x="12" y="22" font-family="'Inter', sans-serif" font-size="13.5" font-weight="bold" fill="#FFFFFF">Diagnosis Result</text>
      <text x="12" y="44" font-family="'Inter', sans-serif" font-size="12" fill="#E2E8F0">Pathogen: Alternaria solani</text>
      <text x="12" y="64" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#FF8BA7">Severity: Stage 2 (Moderate)</text>
      <text x="12" y="82" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#34D399">Confidence: 94.2%</text>
    </g>

    <g transform="translate(14, 146)">
      <rect width="178" height="80" rx="6" fill="#131B2E" stroke="#38496B"/>
      <text x="12" y="22" font-family="'Inter', sans-serif" font-size="13.5" font-weight="bold" fill="#FFFFFF">Organic Remedy</text>
      <text x="12" y="44" font-family="'Inter', sans-serif" font-size="11.5" fill="#E2E8F0">Spray Copper Oxychloride</text>
      <text x="12" y="62" font-family="'Inter', sans-serif" font-size="11.5" fill="#E2E8F0">2.5g / L before sunset</text>
    </g>

    <rect x="14" y="234" width="178" height="40" rx="6" fill="#10B981" stroke="#34D399" stroke-width="1.5"/>
    <text x="24" y="259" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#022C1A">🔊 PLAY VOICE ADVICE</text>
  </g>

</svg>