<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320">
  <defs>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131B2E"/>
      <stop offset="100%" stop-color="#0B101C"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1D273D"/>
      <stop offset="100%" stop-color="#151C2C"/>
    </linearGradient>
    <linearGradient id="highlightGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#283654"/>
      <stop offset="100%" stop-color="#1B2438"/>
    </linearGradient>
  </defs>
  
  <rect width="600" height="320" fill="url(#bgGrad)"/>
  <circle cx="180" cy="160" r="150" fill="#EF4444" opacity="0.15" filter="url(#neon)"/>

  <!-- Tactical Radar Scope (Left) -->
  <g transform="translate(24, 18)">
    <rect width="330" height="282" rx="10" fill="#140A0E" stroke="#EF4444" stroke-width="2"/>
    
    <circle cx="165" cy="141" r="115" fill="none" stroke="#4D1520" stroke-width="2.5"/>
    <circle cx="165" cy="141" r="78" fill="none" stroke="#4D1520" stroke-width="2.5"/>
    <circle cx="165" cy="141" r="42" fill="none" stroke="#4D1520" stroke-width="2.5"/>

    <line x1="165" y1="20" x2="165" y2="262" stroke="#4D1520" stroke-width="2"/>
    <line x1="20" y1="141" x2="310" y2="141" stroke="#4D1520" stroke-width="2"/>

    <!-- Radar Sweep Arm -->
    <line x1="165" y1="141" x2="260" y2="70" stroke="#EF4444" stroke-width="3.5" filter="url(#neon)"/>
    <polygon points="165,141 260,70 240,50" fill="#EF4444" opacity="0.4"/>

    <!-- Center Beacon -->
    <circle cx="165" cy="141" r="20" fill="#EF444445"/>
    <circle cx="165" cy="141" r="9" fill="#EF4444"/>
    <text x="142" y="174" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="bold" fill="#FFFFFF">YOU (SOS)</text>

    <!-- Responders -->
    <circle cx="225" cy="95" r="8" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="238" y="100" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#38BDF8">Unit #4 (0.8km)</text>

    <circle cx="95" cy="190" r="8" fill="#10B981" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="22" y="212" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#34D399">Ambulance (1.4km)</text>
  </g>

  <!-- Haversine SOS Vectors (Right) -->
  <g transform="translate(370, 18)">
    <rect width="206" height="282" rx="10" fill="url(#cardGrad)" stroke="#38496B" stroke-width="1.5"/>
    <text x="18" y="28" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#FF8BA7">HAVERSINE SOS VECTORS</text>

    <g transform="translate(14, 42)">
      <rect width="178" height="66" rx="6" fill="#2E0A0F" stroke="#EF4444" stroke-width="1.5"/>
      <text x="12" y="24" font-family="'Inter', sans-serif" font-size="13.5" font-weight="bold" fill="#FFFFFF">Distress Signal Active</text>
      <text x="12" y="46" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#FF8BA7">5 Emergency Contacts Notified</text>
    </g>

    <g transform="translate(14, 120)">
      <rect width="178" height="145" rx="6" fill="#131B2E" stroke="#38496B"/>
      <text x="12" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#38BDF8">GEOSPATIAL TELEMETRY</text>
      <text x="12" y="46" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#E2E8F0">LAT: 18.2949 N</text>
      <text x="12" y="64" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#E2E8F0">LON: 83.8938 E</text>
      <text x="12" y="82" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#E2E8F0">ACCURACY: ±3.2m</text>

      <line x1="12" y1="96" x2="166" y2="96" stroke="#25354F"/>

      <text x="12" y="116" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38BDF8">Fastest Responder:</text>
      <text x="12" y="134" font-family="'Inter', sans-serif" font-size="14.5" font-weight="bold" fill="#FFFFFF">ETA: 3 MINS (0.8km)</text>
    </g>
  </g>

</svg>