<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="cardGrad6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121622"/>
      <stop offset="100%" stop-color="#0A0C13"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="#080A0F"/>
  
    <rect x="0" y="0" width="600" height="34" fill="#0E111A" />
    <line x1="0" y1="34" x2="600" y2="34" stroke="#1E2433" stroke-width="1" />
    <circle cx="20" cy="17" r="4.5" fill="#EF4444" opacity="0.8"/>
    <circle cx="36" cy="17" r="4.5" fill="#F59E0B" opacity="0.8"/>
    <circle cx="52" cy="17" r="4.5" fill="#10B981" opacity="0.8"/>
    <rect x="75" y="7" width="280" height="20" rx="4" fill="#080A0F" stroke="#1E2433" stroke-width="1"/>
    <text x="88" y="21" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">https://guardian.ai // SOS GEOSPATIAL RADAR</text>
    <rect x="490" y="8" width="90" height="18" rx="9" fill="#EF444422" stroke="#EF4444" stroke-width="0.75"/>
    <circle cx="502" cy="17" r="2.5" fill="#EF4444"/>
    <text x="512" y="21" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#EF4444">HAVERSINE ACTIVE</text>
  

  <!-- Radar Screen (Left) -->
  <g transform="translate(20, 48)">
    <rect width="320" height="292" rx="8" fill="#05070A" stroke="#1E2538"/>
    
    <!-- Concentric Distance Rings -->
    <circle cx="160" cy="146" r="110" fill="none" stroke="#1A2030" stroke-width="1"/>
    <circle cx="160" cy="146" r="75" fill="none" stroke="#1A2030" stroke-width="1"/>
    <circle cx="160" cy="146" r="40" fill="none" stroke="#1A2030" stroke-width="1"/>
    
    <!-- Crosshairs -->
    <line x1="160" y1="26" x2="160" y2="266" stroke="#1A2030" stroke-width="1"/>
    <line x1="40" y1="146" x2="280" y2="146" stroke="#1A2030" stroke-width="1"/>

    <!-- Radar Sweep Line -->
    <line x1="160" y1="146" x2="250" y2="80" stroke="#EF4444" stroke-width="2"/>
    <polygon points="160,146 250,80 230,60" fill="#EF4444" opacity="0.2"/>

    <!-- Center User Beacon (SOS) -->
    <circle cx="160" cy="146" r="14" fill="#EF444433"/>
    <circle cx="160" cy="146" r="6" fill="#EF4444"/>
    <text x="144" y="172" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" fill="#EF4444">YOU (SOS)</text>

    <!-- Responder Unit 1 -->
    <circle cx="210" cy="100" r="5" fill="#38BDF8"/>
    <text x="220" y="104" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#38BDF8">Unit #4 (0.8km)</text>

    <!-- Responder Unit 2 -->
    <circle cx="100" cy="190" r="5" fill="#10B981"/>
    <text x="35" y="206" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#10B981">Ambulance (1.4km)</text>
  </g>

  <!-- Right Panel: Telemetry &amp; Live Haversine Vectors -->
  <g transform="translate(356, 48)">
    <rect width="224" height="292" rx="8" fill="url(#cardGrad6)" stroke="#1E2538"/>
    <text x="16" y="28" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#EF4444">EMERGENCY BROADCAST</text>

    <g transform="translate(14, 42)">
      <rect width="196" height="56" rx="6" fill="#EF444415" stroke="#EF444444"/>
      <text x="10" y="20" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#F8FAFC">Distress Signal Active</text>
      <text x="10" y="38" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#EF4444">SMS &amp; Location Transmitted</text>
    </g>

    <g transform="translate(14, 110)">
      <rect width="196" height="155" rx="6" fill="#080A0F" stroke="#1E2538"/>
      <text x="12" y="22" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="bold" fill="#94A3B8">HAVERSINE METRICS</text>
      
      <text x="12" y="44" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748B">LAT: 18.2949 N</text>
      <text x="12" y="58" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748B">LON: 83.8938 E</text>
      <text x="12" y="72" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748B">ACCURACY: ±3.2m</text>

      <line x1="12" y1="84" x2="184" y2="84" stroke="#1E2538"/>

      <text x="12" y="104" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38BDF8">Fastest Responder:</text>
      <text x="12" y="120" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#F8FAFC">ETA: 3 mins (0.8km)</text>
      <text x="12" y="138" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#10B981">Dispatch Confirmed ✓</text>
    </g>
  </g>
</svg>