<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <linearGradient id="bgGuard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#190F13"/>
      <stop offset="100%" stop-color="#0E080A"/>
    </linearGradient>
    <linearGradient id="panelGuard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#26161D"/>
      <stop offset="100%" stop-color="#180D12"/>
    </linearGradient>
  </defs>

  <rect width="600" height="340" fill="url(#bgGuard)"/>

  <!-- Top App Window Bar -->
  <g transform="translate(0, 0)">
    <rect width="600" height="36" fill="#0A0E18" stroke="#1E293B" stroke-width="1"/>
    <circle cx="20" cy="18" r="4.5" fill="#EF4444"/>
    <circle cx="36" cy="18" r="4.5" fill="#F59E0B"/>
    <circle cx="52" cy="18" r="4.5" fill="#10B981"/>

    <rect x="140" y="8" width="320" height="20" rx="10" fill="#1C1117" stroke="#381D2A" stroke-width="1"/>
    <text x="300" y="22" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#94A3B8" text-anchor="middle">guardian-ai.safety/emergency-command</text>

    <rect x="475" y="8" width="110" height="20" rx="10" fill="#4C0519" stroke="#E11D48" stroke-width="1"/>
    <circle cx="487" cy="18" r="3" fill="#FB7185"/>
    <text x="537" y="22" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#FDA4AF" text-anchor="middle">ACTIVE ALARM</text>
  </g>

  <!-- Main Layout -->
  <!-- Left Side: Tactical Geo-Radar Beacon (280 width) -->
  <g transform="translate(18, 48)">
    <rect width="275" height="276" rx="12" fill="url(#panelGuard)" stroke="#381D2A" stroke-width="1"/>

    <g transform="translate(16, 16)">
      <text x="0" y="0" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">Geospatial SOS Radar</text>
      <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="9" fill="#E11D48">GPS Precision Tracking Active</text>
    </g>

    <!-- Radar Circle Display -->
    <g transform="translate(137, 140)">
      <circle cx="0" cy="0" r="75" fill="#13080C" stroke="#3D1825" stroke-width="1"/>
      <circle cx="0" cy="0" r="50" fill="none" stroke="#521B2E" stroke-width="1" stroke-dasharray="2 2"/>
      <circle cx="0" cy="0" r="25" fill="none" stroke="#7A203E" stroke-width="1"/>

      <!-- Crosshairs -->
      <line x1="-75" y1="0" x2="75" y2="0" stroke="#3D1825" stroke-width="1"/>
      <line x1="0" y1="-75" x2="0" y2="75" stroke="#3D1825" stroke-width="1"/>

      <!-- Radar Pulse Sweep -->
      <path d="M0 0 L53 -53 A75 75 0 0 1 75 0 Z" fill="#E11D48" fill-opacity="0.2"/>

      <!-- SOS Origin Center -->
      <circle cx="0" cy="0" r="8" fill="#E11D48" fill-opacity="0.4"/>
      <circle cx="0" cy="0" r="4.5" fill="#EF4444"/>

      <!-- Nearest Responder Node -->
      <circle cx="34" cy="-28" r="5" fill="#38BDF8"/>
      <text x="42" y="-25" font-family="'JetBrains Mono', monospace" font-size="8" fill="#38BDF8">POLICE (850m)</text>
    </g>

    <!-- Coordinates Footer -->
    <g transform="translate(16, 235)">
      <rect width="243" height="26" rx="6" fill="#13080C" stroke="#2B141E"/>
      <text x="12" y="17" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#94A3B8">
        BEACON: <tspan fill="#FFFFFF">18.2914°N, 83.8962°E</tspan> · LOCK 100%
      </text>
    </g>
  </g>

  <!-- Right Side: Threat Assessment & Automated Dispatch Actions (280 width) -->
  <g transform="translate(303, 48)">
    <rect width="279" height="276" rx="12" fill="url(#panelGuard)" stroke="#381D2A" stroke-width="1"/>

    <g transform="translate(16, 16)">
      <text x="0" y="0" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">Automated Threat Mitigation</text>
      <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="9" fill="#34D399">FastAPI Event Daemon</text>
    </g>

    <!-- Incident Status Card -->
    <g transform="translate(16, 46)">
      <rect width="247" height="66" rx="8" fill="#170A0F" stroke="#E11D48" stroke-width="1"/>
      <g transform="translate(12, 18)">
        <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#FB7185">INCIDENT SEVERITY: HIGH</text>
        <text x="0" y="20" font-family="'Inter', sans-serif" font-size="13.5" font-weight="bold" fill="#FFFFFF">SOS Dispatch Protocol Armed</text>
        <text x="0" y="38" font-family="'JetBrains Mono', monospace" font-size="9" fill="#34D399">Responder Dispatch Time: 1.2s ✓</text>
      </g>
    </g>

    <!-- Triggered Action Checklist -->
    <g transform="translate(16, 126)">
      <text x="0" y="0" font-family="'Inter', sans-serif" font-size="9" font-weight="bold" fill="#94A3B8">DISPATCH AUDIT LOG</text>

      <g transform="translate(0, 10)">
        <rect x="0" y="0" width="247" height="34" rx="6" fill="#13080C" stroke="#2B141E"/>
        <text x="10" y="21" font-family="'Inter', sans-serif" font-size="9.5" fill="#34D399">✓ 14 Emergency Contacts Dispatched</text>

        <rect x="0" y="40" width="247" height="34" rx="6" fill="#13080C" stroke="#2B141E"/>
        <text x="10" y="61" font-family="'Inter', sans-serif" font-size="9.5" fill="#38BDF8">✓ Live Audio Recording Streamed to Cloud</text>

        <rect x="0" y="80" width="247" height="34" rx="6" fill="#13080C" stroke="#2B141E"/>
        <text x="10" y="101" font-family="'Inter', sans-serif" font-size="9.5" fill="#F1F5F9">✓ Nearest PCR Van Assigned (ETA 4m)</text>
      </g>
    </g>
  </g>
</svg>