<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <linearGradient id="bgStock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E1624"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>
    <linearGradient id="stockArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#10B981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="panelStock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141E30"/>
      <stop offset="100%" stop-color="#0F1624"/>
    </linearGradient>
  </defs>

  <rect width="600" height="340" fill="url(#bgStock)"/>

  <!-- Top App Window Bar -->
  <g transform="translate(0, 0)">
    <rect width="600" height="36" fill="#0A0E18" stroke="#1E293B" stroke-width="1"/>
    <circle cx="20" cy="18" r="4.5" fill="#EF4444"/>
    <circle cx="36" cy="18" r="4.5" fill="#F59E0B"/>
    <circle cx="52" cy="18" r="4.5" fill="#10B981"/>

    <rect x="140" y="8" width="320" height="20" rx="10" fill="#131B2B" stroke="#223048" stroke-width="1"/>
    <text x="300" y="22" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#94A3B8" text-anchor="middle">market-analyzer.terminal/portfolio-risk</text>

    <rect x="475" y="8" width="110" height="20" rx="10" fill="#064E3B" stroke="#059669" stroke-width="1"/>
    <circle cx="487" cy="18" r="3" fill="#34D399"/>
    <text x="537" y="22" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#34D399" text-anchor="middle">MARKET LIVE</text>
  </g>

  <!-- Main Financial Dashboard -->
  <!-- Left Side: Area Chart & Metric (370 width) -->
  <g transform="translate(18, 48)">
    <rect width="365" height="276" rx="12" fill="url(#panelStock)" stroke="#223552" stroke-width="1"/>

    <!-- Portfolio Metric Summary -->
    <g transform="translate(16, 16)">
      <text x="0" y="0" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#94A3B8">NET PORTFOLIO VALUATION</text>
      <text x="0" y="28" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="900" fill="#FFFFFF">$148,920.50</text>
      <text x="195" y="28" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#34D399">+$4,280.10 (+2.96%) ↑</text>
    </g>

    <!-- Chart Timeframe Tabs -->
    <g transform="translate(235, 12)">
      <rect width="115" height="22" rx="6" fill="#0D1524" stroke="#1E293B"/>
      <text x="12" y="15" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748B">1D</text>
      <text x="34" y="15" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748B">1W</text>
      <text x="56" y="15" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#34D399">1M</text>
      <text x="82" y="15" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748B">1Y</text>
    </g>

    <!-- Elegant Area Chart -->
    <g transform="translate(16, 68)">
      <!-- Horizontal Reference Gridlines -->
      <line x1="0" y1="20" x2="333" y2="20" stroke="#1E293B" stroke-dasharray="3 3"/>
      <text x="310" y="18" font-family="'JetBrains Mono', monospace" font-size="8" fill="#475569">$150K</text>

      <line x1="0" y1="70" x2="333" y2="70" stroke="#1E293B" stroke-dasharray="3 3"/>
      <text x="310" y="68" font-family="'JetBrains Mono', monospace" font-size="8" fill="#475569">$140K</text>

      <line x1="0" y1="120" x2="333" y2="120" stroke="#1E293B" stroke-dasharray="3 3"/>
      <text x="310" y="118" font-family="'JetBrains Mono', monospace" font-size="8" fill="#475569">$130K</text>

      <!-- Shaded Gradient Area Fill -->
      <path d="M0 130 C40 120, 70 110, 100 95 C140 75, 170 100, 200 65 C230 35, 270 45, 333 15 L333 160 L0 160 Z" fill="url(#stockArea)"/>

      <!-- Smooth Illuminated Spline Curve -->
      <path d="M0 130 C40 120, 70 110, 100 95 C140 75, 170 100, 200 65 C230 35, 270 45, 333 15" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>

      <!-- High Peak Marker -->
      <circle cx="333" cy="15" r="5" fill="#34D399" stroke="#FFFFFF" stroke-width="2"/>
    </g>

    <!-- Live Ticker Ribbon (Bottom) -->
    <g transform="translate(16, 240)">
      <rect width="333" height="24" rx="6" fill="#0D1524" stroke="#1E293B"/>
      <text x="10" y="16" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8">
        <tspan font-weight="bold" fill="#F1F5F9">NVDA</tspan> <tspan fill="#34D399">+3.8%</tspan> • <tspan font-weight="bold" fill="#F1F5F9">MSFT</tspan> <tspan fill="#34D399">+1.9%</tspan> • <tspan font-weight="bold" fill="#F1F5F9">AAPL</tspan> <tspan fill="#34D399">+2.1%</tspan> • <tspan font-weight="bold" fill="#F1F5F9">NIFTY</tspan> <tspan fill="#34D399">+1.2%</tspan>
      </text>
    </g>
  </g>

  <!-- Right Side: Risk & Asset Allocation (190 width) -->
  <g transform="translate(393, 48)">
    <rect width="189" height="276" rx="12" fill="url(#panelStock)" stroke="#223552" stroke-width="1"/>

    <g transform="translate(14, 16)">
      <text x="0" y="0" font-family="'Inter', sans-serif" font-size="11.5" font-weight="bold" fill="#FFFFFF">Asset Distribution</text>
      <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38BDF8">Brainovision 1st Prize Model</text>
    </g>

    <!-- Allocation Bars -->
    <g transform="translate(14, 46)">
      <!-- Item 1: Tech Equities -->
      <text x="0" y="10" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8">Tech Equities (46%)</text>
      <text x="125" y="10" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#FFFFFF">$68,500</text>
      <rect x="0" y="16" width="160" height="6" rx="3" fill="#1E293B"/>
      <rect x="0" y="16" width="74" height="6" rx="3" fill="#38BDF8"/>

      <!-- Item 2: AI & Cloud Growth -->
      <text x="0" y="38" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8">AI &amp; Cloud (34%)</text>
      <text x="125" y="38" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#FFFFFF">$50,630</text>
      <rect x="0" y="44" width="160" height="6" rx="3" fill="#1E293B"/>
      <rect x="0" y="44" width="54" height="6" rx="3" fill="#10B981"/>

      <!-- Item 3: Liquid Cash / Index -->
      <text x="0" y="66" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8">Liquid Reserves (20%)</text>
      <text x="125" y="66" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#FFFFFF">$29,790</text>
      <rect x="0" y="72" width="160" height="6" rx="3" fill="#1E293B"/>
      <rect x="0" y="72" width="32" height="6" rx="3" fill="#A855F7"/>
    </g>

    <!-- Risk Analytics Metrics -->
    <g transform="translate(14, 142)">
      <rect width="160" height="114" rx="8" fill="#0D1524" stroke="#1E293B"/>
      <g transform="translate(10, 16)">
        <text x="0" y="0" font-family="'Inter', sans-serif" font-size="9" fill="#64748B">Sharpe Ratio</text>
        <text x="0" y="16" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" fill="#34D399">2.84 (Exceptional)</text>

        <text x="0" y="38" font-family="'Inter', sans-serif" font-size="9" fill="#64748B">Portfolio Beta</text>
        <text x="0" y="54" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" fill="#38BDF8">0.72 (Low Volatility)</text>

        <text x="0" y="76" font-family="'Inter', sans-serif" font-size="9" fill="#64748B">Max Drawdown</text>
        <text x="0" y="92" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" fill="#F1F5F9">-3.12% Controlled</text>
      </g>
    </g>
  </g>
</svg>