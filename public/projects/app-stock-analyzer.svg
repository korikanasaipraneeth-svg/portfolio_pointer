<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320">
  <defs>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131B2E"/>
      <stop offset="100%" stop-color="#0B101C"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1D273D"/>
      <stop offset="100%" stop-color="#151C2C"/>
    </linearGradient>
    <linearGradient id="highlightGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#283654"/>
      <stop offset="100%" stop-color="#1B2438"/>
    </linearGradient>
  </defs>
  
  <rect width="600" height="320" fill="url(#bgGrad)"/>
  <circle cx="500" cy="80" r="160" fill="#10B981" opacity="0.15" filter="url(#neon)"/>

  <!-- Top Hero Stats Ribbon -->
  <g transform="translate(24, 18)">
    <rect width="552" height="64" rx="10" fill="url(#cardGrad)" stroke="#38496B" stroke-width="1.5"/>
    <text x="20" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#38BDF8">PORTFOLIO &amp; STOCK ANALYZER // LIVE ALPHA</text>
    <text x="20" y="52" font-family="'Inter', sans-serif" font-size="28" font-weight="900" fill="#FFFFFF">$148,920.50</text>

    <!-- Profit Badge -->
    <rect x="250" y="16" width="130" height="32" rx="6" fill="#10B981" stroke="#34D399" stroke-width="1"/>
    <text x="264" y="37" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="bold" fill="#022C1A">+24.8% PROFIT</text>

    <rect x="395" y="16" width="145" height="32" rx="6" fill="#E0526935" stroke="#E05269" stroke-width="1.5"/>
    <text x="410" y="37" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#FF8BA7">+18.4% SHARPE</text>
  </g>

  <!-- Big Candlestick Chart -->
  <g transform="translate(24, 94)">
    <rect width="552" height="206" rx="10" fill="url(#highlightGrad)" stroke="#38496B" stroke-width="1.5"/>
    
    <line x1="20" y1="45" x2="532" y2="45" stroke="#283550" stroke-dasharray="4,4"/>
    <line x1="20" y1="95" x2="532" y2="95" stroke="#283550" stroke-dasharray="4,4"/>
    <line x1="20" y1="145" x2="532" y2="145" stroke="#283550" stroke-dasharray="4,4"/>

    <!-- Vivid Candlesticks -->
    <line x1="60" y1="75" x2="60" y2="155" stroke="#10B981" stroke-width="3"/>
    <rect x="46" y="90" width="28" height="50" rx="3" fill="#10B981"/>
    
    <line x1="120" y1="60" x2="120" y2="140" stroke="#10B981" stroke-width="3"/>
    <rect x="106" y="75" width="28" height="52" rx="3" fill="#10B981"/>

    <line x1="180" y1="70" x2="180" y2="150" stroke="#EF4444" stroke-width="3"/>
    <rect x="166" y="85" width="28" height="48" rx="3" fill="#EF4444"/>

    <line x1="240" y1="45" x2="240" y2="125" stroke="#10B981" stroke-width="3"/>
    <rect x="226" y="60" width="28" height="52" rx="3" fill="#10B981"/>

    <line x1="300" y1="60" x2="300" y2="135" stroke="#EF4444" stroke-width="3"/>
    <rect x="286" y="75" width="28" height="42" rx="3" fill="#EF4444"/>

    <!-- Glowing Area Fill & Trend Curve -->
    <path d="M 320 90 Q 380 45 440 65 T 520 18 L 532 15 L 532 175 L 320 175 Z" fill="url(#chartGrad)"/>
    <path d="M 320 90 Q 380 45 440 65 T 520 18 L 532 15" fill="none" stroke="#34D399" stroke-width="4" filter="url(#neon)"/>

    <!-- Tooltip -->
    <g transform="translate(385, 10)">
      <rect width="140" height="48" rx="6" fill="#0C1322" stroke="#34D399" stroke-width="2"/>
      <text x="14" y="20" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#94A3B8">INFY: $184.20</text>
      <text x="14" y="38" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#34D399">VOL: 14.8M +5.2%</text>
    </g>

    <!-- Volume Bars -->
    <rect x="46" y="152" width="28" height="32" fill="#10B981" opacity="0.85" rx="2"/>
    <rect x="106" y="145" width="28" height="39" fill="#10B981" opacity="0.85" rx="2"/>
    <rect x="166" y="160" width="28" height="24" fill="#EF4444" opacity="0.85" rx="2"/>
    <rect x="226" y="138" width="28" height="46" fill="#10B981" opacity="0.9" rx="2"/>
    <rect x="286" y="162" width="28" height="22" fill="#EF4444" opacity="0.85" rx="2"/>
    <rect x="350" y="142" width="28" height="42" fill="#10B981" opacity="0.9" rx="2"/>
    <rect x="410" y="132" width="28" height="52" fill="#10B981" opacity="0.95" rx="2"/>
    <rect x="470" y="122" width="28" height="62" fill="#10B981" opacity="1" rx="2"/>
  </g>

</svg>