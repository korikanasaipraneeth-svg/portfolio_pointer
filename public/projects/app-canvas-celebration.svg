<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320">
  <defs>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131B2E"/>
      <stop offset="100%" stop-color="#0B101C"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1D273D"/>
      <stop offset="100%" stop-color="#151C2C"/>
    </linearGradient>
    <linearGradient id="highlightGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#283654"/>
      <stop offset="100%" stop-color="#1B2438"/>
    </linearGradient>
  </defs>
  
  <rect width="600" height="320" fill="url(#bgGrad)"/>
  <circle cx="180" cy="180" r="160" fill="#E05269" opacity="0.15" filter="url(#neon)"/>

  <!-- Particle Viewport (Left) -->
  <g transform="translate(24, 18)">
    <rect width="350" height="282" rx="10" fill="#10081C" stroke="#E05269" stroke-width="2"/>
    
    <circle cx="175" cy="180" r="22" fill="#E0526950"/>
    <circle cx="175" cy="180" r="9" fill="#E05269"/>

    <!-- Brilliant Arcs -->
    <path d="M 175 180 Q 225 45 285 95" fill="none" stroke="#F59E0B" stroke-width="3.5" stroke-dasharray="4,4"/>
    <circle cx="285" cy="95" r="10" fill="#F59E0B" filter="url(#neon)"/>

    <path d="M 175 180 Q 115 25 60 75" fill="none" stroke="#38BDF8" stroke-width="3.5" stroke-dasharray="4,4"/>
    <circle cx="60" cy="75" r="9" fill="#38BDF8" filter="url(#neon)"/>

    <path d="M 175 180 Q 265 125 315 205" fill="none" stroke="#10B981" stroke-width="3.5" stroke-dasharray="4,4"/>
    <circle cx="315" cy="205" r="11" fill="#10B981" filter="url(#neon)"/>

    <path d="M 175 180 Q 95 145 45 215" fill="none" stroke="#E05269" stroke-width="3.5" stroke-dasharray="4,4"/>
    <circle cx="45" cy="215" r="10" fill="#E05269" filter="url(#neon)"/>

    <path d="M 175 180 Q 175 10 175 35" fill="none" stroke="#C084FC" stroke-width="3.5" stroke-dasharray="4,4"/>
    <circle cx="175" cy="35" r="9" fill="#C084FC" filter="url(#neon)"/>

    <circle cx="130" cy="110" r="6" fill="#F59E0B"/>
    <circle cx="210" cy="100" r="7" fill="#38BDF8"/>
    <circle cx="230" cy="150" r="5.5" fill="#10B981"/>
    <circle cx="110" cy="190" r="6" fill="#E05269"/>
    <circle cx="190" cy="230" r="5.5" fill="#C084FC"/>

    <rect x="14" y="14" width="144" height="46" rx="6" fill="#1D0E29" stroke="#E05269"/>
    <text x="24" y="32" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#E2E8F0">PARTICLES: 250</text>
    <text x="24" y="48" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#FF8BA7">VERLET PHYSICS</text>
  </g>

  <!-- Physics Engine Sliders (Right) -->
  <g transform="translate(385, 18)">
    <rect width="191" height="282" rx="10" fill="url(#cardGrad)" stroke="#38496B" stroke-width="1.5"/>
    <text x="16" y="28" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#FFFFFF">PHYSICS ENGINE</text>

    <g transform="translate(16, 46)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="bold" fill="#FF8BA7">GRAVITY (0.98 G)</text>
      <rect y="10" width="159" height="10" rx="5" fill="#131B2E"/>
      <rect y="10" width="105" height="10" rx="5" fill="#E05269"/>
      <circle cx="105" cy="15" r="7" fill="#FFFFFF"/>
    </g>

    <g transform="translate(16, 96)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="bold" fill="#38BDF8">AIR RESISTANCE (0.05)</text>
      <rect y="10" width="159" height="10" rx="5" fill="#131B2E"/>
      <rect y="10" width="55" height="10" rx="5" fill="#38BDF8"/>
      <circle cx="55" cy="15" r="7" fill="#FFFFFF"/>
    </g>

    <g transform="translate(16, 146)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="bold" fill="#34D399">RESTITUTION (0.85)</text>
      <rect y="10" width="159" height="10" rx="5" fill="#131B2E"/>
      <rect y="10" width="128" height="10" rx="5" fill="#10B981"/>
      <circle cx="128" cy="15" r="7" fill="#FFFFFF"/>
    </g>

    <rect x="16" y="218" width="159" height="42" rx="6" fill="#E05269" stroke="#FF8BA7"/>
    <text x="34" y="244" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#FFFFFF">TRIGGER BURST</text>
  </g>

</svg>