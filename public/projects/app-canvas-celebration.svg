<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="cardGrad10" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121622"/>
      <stop offset="100%" stop-color="#0A0C13"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="#080A0F"/>
  
    <rect x="0" y="0" width="600" height="34" fill="#0E111A" />
    <line x1="0" y1="34" x2="600" y2="34" stroke="#1E2433" stroke-width="1" />
    <circle cx="20" cy="17" r="4.5" fill="#EF4444" opacity="0.8"/>
    <circle cx="36" cy="17" r="4.5" fill="#F59E0B" opacity="0.8"/>
    <circle cx="52" cy="17" r="4.5" fill="#10B981" opacity="0.8"/>
    <rect x="75" y="7" width="280" height="20" rx="4" fill="#080A0F" stroke="#1E2433" stroke-width="1"/>
    <text x="88" y="21" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">https://canvas-physics.dev // SPRING SIMULATOR</text>
    <rect x="490" y="8" width="90" height="18" rx="9" fill="#E0526922" stroke="#E05269" stroke-width="0.75"/>
    <circle cx="502" cy="17" r="2.5" fill="#E05269"/>
    <text x="512" y="21" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#E05269">60 FPS ENGINE</text>
  

  <!-- 2D Canvas Particle Explosion Viewport -->
  <g transform="translate(20, 48)">
    <rect width="360" height="292" rx="8" fill="#05070A" stroke="#1E2538"/>
    
    <!-- Origin burst point -->
    <circle cx="180" cy="180" r="12" fill="#E0526933"/>
    <circle cx="180" cy="180" r="4" fill="#E05269"/>

    <!-- Radiating Particle Trajectories with velocity vectors -->
    <!-- Arc 1 -->
    <path d="M 180 180 Q 230 60 280 110" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3,3"/>
    <circle cx="280" cy="110" r="6" fill="#F59E0B"/>
    <!-- Arc 2 -->
    <path d="M 180 180 Q 120 40 70 90" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3,3"/>
    <circle cx="70" cy="90" r="5" fill="#38BDF8"/>
    <!-- Arc 3 -->
    <path d="M 180 180 Q 260 140 310 210" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="3,3"/>
    <circle cx="310" cy="210" r="7" fill="#10B981"/>
    <!-- Arc 4 -->
    <path d="M 180 180 Q 100 160 50 230" fill="none" stroke="#E05269" stroke-width="1.5" stroke-dasharray="3,3"/>
    <circle cx="50" cy="230" r="6" fill="#E05269"/>
    <!-- Arc 5 -->
    <path d="M 180 180 Q 180 20 180 40" fill="none" stroke="#A855F7" stroke-width="1.5" stroke-dasharray="3,3"/>
    <circle cx="180" cy="40" r="6" fill="#A855F7"/>

    <!-- Dispersed micro confetti particles -->
    <circle cx="140" cy="120" r="3" fill="#F59E0B"/>
    <circle cx="220" cy="110" r="3.5" fill="#38BDF8"/>
    <circle cx="240" cy="160" r="2.5" fill="#10B981"/>
    <circle cx="120" cy="200" r="3" fill="#E05269"/>
    <circle cx="200" cy="240" r="2" fill="#A855F7"/>
    <circle cx="160" cy="80" r="4" fill="#38BDF8"/>
    <circle cx="260" cy="70" r="2" fill="#10B981"/>

    <rect x="14" y="14" width="120" height="38" rx="4" fill="#080A0FDD" stroke="#1E2538"/>
    <text x="22" y="28" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#94A3B8">PARTICLES: 250</text>
    <text x="22" y="42" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" fill="#E05269">PHYSICS: VERLET</text>
  </g>

  <!-- Right Panel: Physics Controller Sliders -->
  <g transform="translate(396, 48)">
    <rect width="184" height="292" rx="8" fill="url(#cardGrad10)" stroke="#1E2538"/>
    <text x="14" y="26" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#F8FAFC">PHYSICS PARAMETERS</text>

    <!-- Slider 1: Gravity -->
    <g transform="translate(14, 46)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#94A3B8">GRAVITY (0.98 G)</text>
      <rect y="8" width="156" height="6" rx="3" fill="#161B29"/>
      <rect y="8" width="98" height="6" rx="3" fill="#E05269"/>
      <circle cx="98" cy="11" r="5" fill="#F8FAFC"/>
    </g>

    <!-- Slider 2: Friction -->
    <g transform="translate(14, 90)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#94A3B8">DRAG / AIR RES (0.05)</text>
      <rect y="8" width="156" height="6" rx="3" fill="#161B29"/>
      <rect y="8" width="45" height="6" rx="3" fill="#38BDF8"/>
      <circle cx="45" cy="11" r="5" fill="#F8FAFC"/>
    </g>

    <!-- Slider 3: Elasticity -->
    <g transform="translate(14, 134)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#94A3B8">BOUNCE / RESTITUTION</text>
      <rect y="8" width="156" height="6" rx="3" fill="#161B29"/>
      <rect y="8" width="124" height="6" rx="3" fill="#10B981"/>
      <circle cx="124" cy="11" r="5" fill="#F8FAFC"/>
    </g>

    <rect x="14" y="210" width="156" height="38" rx="6" fill="#E0526922" stroke="#E05269"/>
    <text x="32" y="234" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#E05269">TRIGGER BURST</text>
  </g>
</svg>