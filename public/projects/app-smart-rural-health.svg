<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <linearGradient id="medGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E1726"/>
      <stop offset="100%" stop-color="#070C14"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#142136"/>
      <stop offset="100%" stop-color="#0E1624"/>
    </linearGradient>
    <linearGradient id="ecgGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="1"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" fill="url(#medGrad)"/>

  <!-- Top App Window Bar -->
  <g transform="translate(0, 0)">
    <rect width="600" height="36" fill="#0A0E18" stroke="#1E293B" stroke-width="1"/>
    <circle cx="20" cy="18" r="4.5" fill="#EF4444"/>
    <circle cx="36" cy="18" r="4.5" fill="#F59E0B"/>
    <circle cx="52" cy="18" r="4.5" fill="#10B981"/>

    <rect x="140" y="8" width="320" height="20" rx="10" fill="#131B2B" stroke="#223048" stroke-width="1"/>
    <text x="300" y="22" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#94A3B8" text-anchor="middle">smart-rural-health.ai/clinical-triage</text>

    <rect x="480" y="8" width="105" height="20" rx="10" fill="#064E3B" stroke="#059669" stroke-width="1"/>
    <circle cx="492" cy="18" r="3" fill="#34D399"/>
    <text x="537" y="22" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#34D399" text-anchor="middle">ACTIVE TRIAGE</text>
  </g>

  <!-- Three-Column Clinical Interface -->
  <!-- Col 1: Patient Vitals & Real-Time ECG (220 width) -->
  <g transform="translate(18, 50)">
    <rect width="215" height="274" rx="12" fill="url(#panelGrad)" stroke="#223552" stroke-width="1"/>
    
    <!-- Patient Header -->
    <g transform="translate(14, 16)">
      <text x="0" y="0" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">Patient Telemetry #4892</text>
      <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10B981">● REAL-TIME MONITORING</text>
    </g>

    <!-- Medical ECG Rhythm Wave -->
    <g transform="translate(14, 46)">
      <rect width="187" height="66" rx="8" fill="#0A101D" stroke="#1C2B42" stroke-width="1"/>
      <path d="M0 33 L25 33 L32 20 L40 46 L48 8 L56 58 L64 33 L95 33 L102 20 L110 46 L118 8 L126 58 L134 33 L187 33" fill="none" stroke="url(#ecgGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="145" y="16" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#10B981">72 BPM</text>
    </g>

    <!-- Vitals Metric Cards -->
    <g transform="translate(14, 124)">
      <!-- Metric 1: SpO2 -->
      <g transform="translate(0, 0)">
        <rect width="88" height="58" rx="8" fill="#0B1322" stroke="#1E2D44"/>
        <text x="10" y="18" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8">Oxygen (SpO2)</text>
        <text x="10" y="42" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold" fill="#38BDF8">98.4%</text>
      </g>

      <!-- Metric 2: Blood Pressure -->
      <g transform="translate(99, 0)">
        <rect width="88" height="58" rx="8" fill="#0B1322" stroke="#1E2D44"/>
        <text x="10" y="18" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8">Blood Pressure</text>
        <text x="10" y="42" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold" fill="#34D399">120/80</text>
      </g>

      <!-- Metric 3: Body Temp -->
      <g transform="translate(0, 66)">
        <rect width="88" height="58" rx="8" fill="#0B1322" stroke="#1E2D44"/>
        <text x="10" y="18" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8">Temperature</text>
        <text x="10" y="42" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold" fill="#F1F5F9">98.6°F</text>
      </g>

      <!-- Metric 4: Respiratory -->
      <g transform="translate(99, 66)">
        <rect width="88" height="58" rx="8" fill="#0B1322" stroke="#1E2D44"/>
        <text x="10" y="18" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8">Respiratory</text>
        <text x="10" y="42" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold" fill="#A855F7">16 bpm</text>
      </g>
    </g>
  </g>

  <!-- Col 2: AI Predictive Clinical Diagnosis (185 width) -->
  <g transform="translate(245, 50)">
    <rect width="180" height="274" rx="12" fill="url(#panelGrad)" stroke="#223552" stroke-width="1"/>
    
    <g transform="translate(14, 16)">
      <text x="0" y="0" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">AI Diagnostic Analysis</text>
      <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38BDF8">FastAPI Predictive Core</text>
    </g>

    <!-- Diagnostic Confidence Card -->
    <g transform="translate(14, 46)">
      <rect width="152" height="74" rx="8" fill="#132138" stroke="#0284C7" stroke-width="1.2"/>
      <text x="10" y="18" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#38BDF8">PREDICTION CONFIDENCE</text>
      <text x="10" y="44" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="bold" fill="#FFFFFF">94.6%</text>
      <text x="10" y="62" font-family="'Inter', sans-serif" font-size="9" fill="#34D399">● Acute Bronchial Pattern</text>
    </g>

    <!-- Symptom Matrix Pills -->
    <g transform="translate(14, 132)">
      <text x="0" y="10" font-family="'Inter', sans-serif" font-size="9" font-weight="bold" fill="#94A3B8">IDENTIFIED SYMPTOMS</text>
      
      <rect x="0" y="20" width="152" height="26" rx="6" fill="#0B1322" stroke="#1E2D44"/>
      <text x="8" y="37" font-family="'Inter', sans-serif" font-size="9.5" fill="#F1F5F9">Persistent Cough • 88%</text>

      <rect x="0" y="52" width="152" height="26" rx="6" fill="#0B1322" stroke="#1E2D44"/>
      <text x="8" y="69" font-family="'Inter', sans-serif" font-size="9.5" fill="#F1F5F9">Low-Grade Fever • 76%</text>

      <rect x="0" y="84" width="152" height="26" rx="6" fill="#0B1322" stroke="#1E2D44"/>
      <text x="8" y="101" font-family="'Inter', sans-serif" font-size="9.5" fill="#F1F5F9">Chest Tightness • 65%</text>
    </g>
  </g>

  <!-- Col 3: Rural Supply Chain & SOS Ambulance Dispatch (145 width) -->
  <g transform="translate(437, 50)">
    <rect width="145" height="274" rx="12" fill="url(#panelGrad)" stroke="#223552" stroke-width="1"/>
    
    <g transform="translate(12, 16)">
      <text x="0" y="0" font-family="'Inter', sans-serif" font-size="11.5" font-weight="bold" fill="#FFFFFF">Emergency SOS</text>
      <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="9" fill="#E05269">GPS PROXIMITY ACTIVE</text>
    </g>

    <!-- SOS Beacon Card -->
    <g transform="translate(12, 46)">
      <rect width="121" height="96" rx="8" fill="#1C1420" stroke="#E05269" stroke-width="1.2"/>
      <circle cx="60" cy="38" r="22" fill="#E05269" fill-opacity="0.15"/>
      <circle cx="60" cy="38" r="14" fill="#E05269" fill-opacity="0.3"/>
      <circle cx="60" cy="38" r="6" fill="#E05269"/>
      <text x="60" y="74" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">AMBULANCE EN ROUTE</text>
      <text x="60" y="88" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#E05269" text-anchor="middle">ETA: 8 MINS (3.2km)</text>
    </g>

    <!-- Medicine Shortage Prevention -->
    <g transform="translate(12, 154)">
      <text x="0" y="10" font-family="'Inter', sans-serif" font-size="9" font-weight="bold" fill="#94A3B8">SUPPLY PREDICTION</text>

      <rect x="0" y="20" width="121" height="42" rx="6" fill="#0B1322" stroke="#1E2D44"/>
      <text x="8" y="36" font-family="'Inter', sans-serif" font-size="8.5" fill="#34D399">✓ Inhaler Transfer</text>
      <text x="8" y="52" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748B">Central Hub -> PHC 4</text>

      <rect x="0" y="68" width="121" height="42" rx="6" fill="#0B1322" stroke="#1E2D44"/>
      <text x="8" y="84" font-family="'Inter', sans-serif" font-size="8.5" fill="#38BDF8">✓ Oxygen Reserves</text>
      <text x="8" y="100" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748B">Capacity: 92% Stable</text>
    </g>
  </g>
</svg>