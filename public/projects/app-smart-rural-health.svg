<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320">
  <defs>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131B2E"/>
      <stop offset="100%" stop-color="#0B101C"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1D273D"/>
      <stop offset="100%" stop-color="#151C2C"/>
    </linearGradient>
    <linearGradient id="highlightGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#283654"/>
      <stop offset="100%" stop-color="#1B2438"/>
    </linearGradient>
  </defs>
  
  <rect width="600" height="320" fill="url(#bgGrad)"/>
  <circle cx="160" cy="180" r="160" fill="#10B981" opacity="0.15" filter="url(#neon)"/>

  <!-- Vitals Header -->
  <g transform="translate(24, 18)">
    <rect width="552" height="62" rx="10" fill="url(#cardGrad)" stroke="#38496B" stroke-width="1.5"/>
    <circle cx="34" cy="31" r="18" fill="#38BDF830" stroke="#38BDF8" stroke-width="2"/>
    <text x="27" y="37" font-family="'Inter', sans-serif" font-size="18" font-weight="900" fill="#38BDF8">P</text>
    <text x="64" y="28" font-family="'Inter', sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">Lakshmi Devi (42F)</text>
    <text x="64" y="48" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#38BDF8">ID: #AP-RUR-8841 • DISTRICT CLINIC #04</text>

    <!-- Glowing Vitals -->
    <rect x="260" y="14" width="95" height="34" rx="6" fill="#10B981" stroke="#34D399" stroke-width="1"/>
    <text x="272" y="36" font-family="'Inter', sans-serif" font-size="13.5" font-weight="900" fill="#022C1A">99% SpO2</text>

    <rect x="365" y="14" width="90" height="34" rx="6" fill="#EF4444" stroke="#F87171" stroke-width="1"/>
    <text x="378" y="36" font-family="'Inter', sans-serif" font-size="13.5" font-weight="900" fill="#2E0A0E">74 BPM</text>

    <rect x="465" y="14" width="75" height="34" rx="6" fill="#38BDF8" stroke="#7DD3FC" stroke-width="1"/>
    <text x="475" y="36" font-family="'Inter', sans-serif" font-size="13" font-weight="900" fill="#082F49">120/80</text>
  </g>

  <!-- Glowing Neon ECG Monitor -->
  <g transform="translate(24, 92)">
    <rect width="350" height="208" rx="10" fill="#0B1320" stroke="#25354F" stroke-width="1.8"/>
    <text x="18" y="26" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#34D399">LIVE 3-LEAD CARDIAC ECG WAVEFORM</text>
    
    <line x1="18" y1="65" x2="332" y2="65" stroke="#1D2A42" stroke-dasharray="4,4"/>
    <line x1="18" y1="115" x2="332" y2="115" stroke="#1D2A42" stroke-dasharray="4,4"/>
    <line x1="18" y1="165" x2="332" y2="165" stroke="#1D2A42" stroke-dasharray="4,4"/>

    <!-- High-Voltage Neon-Green Heartbeat Wave -->
    <path d="M 18 115 L 60 115 L 75 110 L 85 118 L 95 115 L 105 115 L 115 45 L 125 165 L 135 75 L 145 115 L 180 115 L 195 110 L 205 118 L 215 115 L 225 115 L 235 45 L 245 165 L 255 75 L 265 115 L 300 115 L 315 110 L 332 115" 
          fill="none" stroke="#10B981" stroke-width="4" filter="url(#neon)"/>

    <text x="18" y="195" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#38BDF8">REAL-TIME SINUS RHYTHM • 500 Hz SENSOR POLLING</text>

    <!-- AI Prescription Dispatch -->
    <g transform="translate(365, 0)">
      <rect width="187" height="208" rx="10" fill="url(#cardGrad)" stroke="#38496B" stroke-width="1.5"/>
      <text x="16" y="26" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#FF8BA7">AI DISPATCH ALERT</text>

      <rect x="14" y="40" width="159" height="72" rx="6" fill="#24131E" stroke="#E05269" stroke-width="1.5"/>
      <text x="24" y="62" font-family="'Inter', sans-serif" font-size="13.5" font-weight="bold" fill="#FFFFFF">Amoxicillin 500mg</text>
      <text x="24" y="82" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="bold" fill="#FF8BA7">LOW: 8 STRIPS REMAIN</text>
      <text x="24" y="98" font-family="'JetBrains Mono', monospace" font-size="10" fill="#E2E8F0">Auto-restock dispatched</text>

      <rect x="14" y="124" width="159" height="54" rx="6" fill="#0D2E1C" stroke="#10B981" stroke-width="1.5"/>
      <text x="24" y="144" font-family="'Inter', sans-serif" font-size="12.5" font-weight="bold" fill="#34D399">Transfer In Route</text>
      <text x="24" y="162" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#E2E8F0">Central Hub AP-01 (38ms)</text>

      <text x="16" y="195" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#34D399">FASTAPI REST // 200 OK</text>
    </g>
  </g>

</svg>